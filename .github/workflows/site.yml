# Build the Quarto website from notes/ and publish it to GitHub Pages.
# Repository settings: Settings -> Pages -> Source: "GitHub Actions".
# This workflow only reads the repository; it never commits or pushes.
name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install pyyaml

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.11.9

      - name: Install TeX (for TikZ -> SVG) and pdftocairo
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            texlive-pictures texlive-science texlive-fonts-recommended \
            poppler-utils

      - name: Restore compiled drawings
        uses: actions/cache@v4
        with:
          path: site/tikz
          key: tikz-${{ hashFiles('notes/**/*.md') }}
          restore-keys: tikz-

      - name: Check notes
        run: make check

      - name: Build site
        run: make site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/_site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
