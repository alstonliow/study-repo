# Build the Quarto website from notes/ and publish it to GitHub Pages.
# Repository settings: Settings -> Pages -> Source: "GitHub Actions".
# This workflow only reads the repository; it never commits or pushes.
name: Publish site

# Speed: PDFs are slow (about 15 minutes), so a push does not rebuild them. They are
# rebuilt every Monday and when the workflow is run by hand with "Build PDFs" ticked;
# other runs reuse the last PDFs from the cache, so the Downloads page keeps working.
# A commit whose message contains [skip ci] does not trigger this workflow at all.
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"   # Mondays 03:00 UTC
  workflow_dispatch:
    inputs:
      pdfs:
        description: "Build PDFs"
        type: boolean
        default: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml mypy types-PyYAML numpy

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.11.9

      # The apt packages are cached: a plain apt-get install sometimes took over 30
      # minutes when the Ubuntu mirror was slow. Change "version" to refresh the cache.
      - name: Install TeX (for TikZ -> SVG) and pdftocairo
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: >-
            texlive-latex-base texlive-latex-recommended texlive-latex-extra
            texlive-pictures texlive-science texlive-fonts-recommended
            texlive-xetex fonts-lmodern lmodern poppler-utils
          execute_install_scripts: true
          version: "1"

      - name: Restore compiled drawings
        uses: actions/cache@v4
        with:
          path: site/tikz
          key: tikz-${{ hashFiles('notes/**/*.md') }}
          restore-keys: tikz-

      - name: Test build scripts
        run: make test

      - name: Check notes
        run: make check

      - name: Decide whether to build PDFs
        id: pdfs
        run: echo "build=${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.pdfs) }}" >> "$GITHUB_OUTPUT"

      - name: Restore last PDFs
        if: steps.pdfs.outputs.build != 'true'
        uses: actions/cache/restore@v4
        with:
          path: out/pdf
          key: pdfs-${{ github.run_id }}
          restore-keys: pdfs-

      # PDFs are optional: if LaTeX fails, the website is still published
      - name: Build PDFs
        if: steps.pdfs.outputs.build == 'true'
        run: make pdf
        continue-on-error: true

      - name: Save PDFs
        if: steps.pdfs.outputs.build == 'true'
        uses: actions/cache/save@v4
        with:
          path: out/pdf
          key: pdfs-${{ github.run_id }}

      - name: Build site
        run: make site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/_site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
