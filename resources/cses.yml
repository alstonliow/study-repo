# CSES Problem Set (cses.fi/problemset), an online judge, as a resource (meta/SPEC.md §17.12.7
# item 6). DRAFT for owner review. CSES gives no difficulty, and the owner decided not to rate it
# (owner decision, 2026-11-26), so the resource is `unrated`: problems sit under one section node per
# CSES section, in CSES's own order. One node per problem: the official title, the task number
# (locator) and the link. Statements, hints and solutions are never copied. Each node names the
# notes it practises (first = primary). Problems whose intended solution has no note yet (Z-function,
# other general DP, merge-sort or persistent trees for range counting, hashing-based palindrome and
# substring queries, ad-hoc and construction problems) are left out. Extended 2026-11-26 with matches
# in the MIT 6.851 / 18.433 / CS 97SI notes, and with notes written for CSES (segment trees, lazy
# propagation, sieve, bridges, 2-SAT, coin change, edit distance, Catalan numbers, Burnside, Manacher,
# centroid decomposition, XOR basis, convex hull trick, digit DP).
# Node ids are the problem's title slug, never its number, and are never renamed.
