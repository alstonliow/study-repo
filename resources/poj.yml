# Peking University Online Judge (POJ, poj.org), an online judge, as a resource (meta/SPEC.md
# §17.12.7 item 6). DRAFT for owner review. One node per problem: the official title, the problem
# number (locator) and the link. POJ gives no difficulty of its own; `rating` is the 0 (easiest)
# to 10 rating of Stanford CS 97SI's problem lists (owner decision, 2026-11-26), and the lists
# cs97si / cs97si-challenge are that course's practice lists and the problems it marks as challenge
# problems. Statements, hints and solutions are never copied. Each node names the notes it practises
# (first = the note it is listed under). Problems whose intended solution has no note yet
# (segment trees, sieves, bridges, ad-hoc and big-number problems) are left out.
# POJ serves only http. Node ids are the problem's title slug, never its number, and are never renamed.
