# UC Berkeley CS 70 (Discrete Mathematics and Probability Theory) course notes, Fall 2020,
# as a resource (meta/SPEC.md §17.12). DRAFT for owner review.
# The notes kept in raw/UCB_CS70 (Notes 1-21) are added round by round; their sections have
# short titles of our own. Locators are <note>.<section>[.<subsection>], so a source key
# is cs70-13.3.5 (Note 13, section 3.5) and cs70-10.6-q3 for an exercise.
# Node ids are stable: never renamed when a title or a locator changes.
id: res-ucb-cs70
kind: course-notes
title: UC Berkeley CS 70 Course Notes
status: draft
courses: [cs70]     # association only: the courses that use this resource (not ownership)
