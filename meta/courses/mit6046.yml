# MIT 6.046 course scope (meta/SPEC.md §13), drafted by Claude for owner review.
# Outline: the lectures of 6.046J Design and Analysis of Algorithms, Spring 2015 (resources
# res-mit-6046-lectures and res-mit-6046-recitations); chapter = lecture number (lectures 19-20 and
# 23-24 each form one chapter), points are our own short titles. Recitation topics are placed with
# the lecture they support.
# Rule (owner, as for the other courses): content in the 6.046 lecture or recitation notes is in
# scope; content that is not is out of scope ("extra"). Shared notes are covered block by block.
id: mit6046
code: MIT 6.046
name: "Design and Analysis of Algorithms"
institution: MIT
source_prefix: mit6046
outline_from: "MIT 6.046J Design and Analysis of Algorithms, Spring 2015, Lectures 1-24 with recitations"
status: draft  # draft until the owner has reviewed the mapping

exclude:
  # Lecture-note problems backfill (2026-11-24): other courses' problems in shared notes
  - prob-mit18335-38-q1
  # MIT 18.065 integration (2026-11-21): its problems in shared notes
  - prob-mit18065ps-24-q2
  # Blocks from other courses' material in notes this course covers
  - prob-mit6006s20-6-q6

