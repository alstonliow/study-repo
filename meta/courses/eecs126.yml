    title: Finite chains
    covers: [math/probability/markov-chains/finite-markov-chains, math/probability/markov-chains/invariant-distributions, math/probability/markov-chains/periodicity-and-convergence, math/probability/markov-chains/hitting-times]
  - id: '5.2'
    title: Countable chains
    covers: [math/probability/markov-chains/countable-markov-chains]
  - id: '5.3'
    title: Reversibility
    covers: [math/probability/markov-chains/reversible-markov-chains]
