    title: Central limit theorem
    covers: [math/probability/continuous/central-limit-theorem]
  - id: '3.5'
    title: Modes of convergence
    covers: [math/probability/continuous/modes-of-convergence]
- num: 4
  title: Random graphs
  points:
  - id: '4.1'
    title: Erdős–Rényi graphs and thresholds
    covers: [math/probability/discrete/random-graphs]
- num: 5
  title: Discrete-time Markov chains
  points:
