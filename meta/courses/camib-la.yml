  - id: '1.2'
    title: Bases, the exchange lemma and dimension
    covers: [math/linear-algebra/abstract-vector-spaces/bases-and-dimension]
  - id: '1.3'
    title: Direct sums
    covers: [math/linear-algebra/abstract-vector-spaces/direct-sums]
