# Cambridge IB Linear Algebra course scope (meta/SPEC.md §13), drafted by Claude for owner review.
# Chapters 1-8 = chapters 1-8 of the Michaelmas 2015 lecture notes (S. J. Wadsley, notes taken by D. Chua).
# The notes are unofficial student notes with no stated licence: kept only in raw/, never copied; all notes are in our own words.
# Example sheets 1-3 (Michaelmas 2026) added as exercises in the notes they practise; routine computations skipped
# (see resources/cam-ib-linear-algebra-sheets.yml).
# TODO: add example sheet 4 when DPMMS publishes it (resource node '4' and its problems).
# Two blocks from MIT 18.06 notes are used as they stand: the Jordan block (def-jordan-block) and Hermitian matrices
# (def-hermitian-unitary).
id: camib-la
code: Cambridge IB Linear Algebra
name: Linear Algebra
institution: University of Cambridge
source_prefix: camib-la-
outline_from: Cambridge Part IB Linear Algebra (Michaelmas 2015, S. J. Wadsley), notes taken by D. Chua
status: draft  # draft until the owner has reviewed the mapping

exclude: []

chapters:
