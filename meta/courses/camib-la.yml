    title: Linear maps and matrices
    covers: [math/linear-algebra/linear-maps/matrices-of-linear-maps]
  - id: '2.3'
    title: The first isomorphism theorem and rank-nullity
    covers: [math/linear-algebra/linear-maps/rank-nullity]
  - id: '2.4'
    title: Change of basis, equivalence and elementary matrices
    covers: [math/linear-algebra/linear-maps/equivalence-and-rank]
- num: 3
  title: Duality
