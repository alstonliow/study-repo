chapters:
  - num: 1
    title: "Proofs"
    points:
      - id: "1.1"
        title: "Propositions"
        covers: [math/discrete/logic/propositional/propositions]
      - id: "1.2"
        title: "Predicates"
        covers: [math/discrete/logic/predicate/predicates]
      - id: "1.3"
        title: "The axiomatic method"
        covers: [math/discrete/proof/theorems-and-proofs]
      - id: "1.5"
        title: "Proving implications"
        covers: [math/discrete/proof/finding-proofs]
      - id: "1.7"
        title: "Proof by cases"
        covers: [math/discrete/proof/techniques]
      - id: "1.8"
        title: "Proof by contradiction"
        covers: [math/discrete/proof/contradiction]
  - num: 2
    title: "Well ordering"
    points:
      - id: "2.1"
        title: "Proofs by well ordering"
        covers: [math/discrete/proof/well-ordering-proofs]
      - id: "2.3"
        title: "Factoring into primes"
        covers: [math/discrete/number-theory/divisibility-and-primes]
  - num: 3
    title: "Logical formulas"
    points:
      - id: "3.1"
        title: "Compound propositions"
        covers: [math/discrete/logic/propositional/connectives, math/discrete/logic/propositional/representing-statements]
      - id: "3.3"
        title: "Equivalence and validity"
        covers: [math/discrete/logic/propositional/implication-and-equivalence, math/discrete/logic/propositional/tautologies]
      - id: "3.4"
        title: "Algebra of propositions"
        covers: [math/discrete/logic/propositional/de-morgans-laws, math/discrete/logic/propositional/laws-of-boolean-algebra, math/discrete/logic/propositional/normal-forms, math/discrete/logic/propositional/universal-sets-of-operations]
      - id: "3.6"
        title: "Predicate formulas"
        covers: [math/discrete/logic/predicate/quantifiers, math/discrete/logic/predicate/multiple-quantifiers, math/discrete/logic/predicate/logic-with-quantifiers]
  - num: 4
    title: "Mathematical data types"
    points:
      - id: "4.1"
        title: "Sets"
        covers: [math/discrete/sets/sets-and-elements, math/discrete/sets/cardinality-and-standard-sets, math/discrete/sets/subsets, math/discrete/sets/power-set, math/discrete/sets/set-operations, math/discrete/sets/symmetric-difference, math/discrete/sets/cartesian-product]
      - id: "4.2"
        title: "Sequences"
        covers: [math/discrete/sequences/basic-sequences]
      - id: "4.3"
        title: "Functions"
        covers: [math/discrete/functions/definitions, math/discrete/functions/special-functions, math/discrete/functions/composition]
      - id: "4.4"
        title: "Binary relations"
        covers: [math/discrete/relations/binary-relations, math/discrete/functions/injections-surjections-bijections, math/discrete/functions/inverse-functions]
      - id: "4.5"
        title: "Finite cardinality"
        covers: [math/discrete/functions/counting]
  - num: 5
    title: "Induction"
    points:
      - id: "5.1"
        title: "Ordinary induction"
        covers: [math/discrete/proof/induction, math/discrete/proof/induction-examples]
      - id: "5.4"
        title: "State machines"
        covers: [math/discrete/proof/state-machines]
  - num: 6
    title: "Recursive data types"
    points:
      - id: "6.1"
        title: "Structural induction"
        covers: [math/discrete/proof/structural-induction]
  - num: 7
    title: "Infinite sets"
    points:
      - id: "7.1"
        title: "Infinite cardinality"
        covers: [math/discrete/functions/countable-sets, math/discrete/functions/cantor-diagonalization]
      - id: "7.2"
        title: "The halting problem"
        covers: [cs/theory/computability]
  - num: 8
    title: "Number theory"
    points:
      - id: "8.1"
        title: "Divisibility"
        covers: [math/discrete/number-theory/remainders-and-parity]
      - id: "8.2"
        title: "Greatest common divisor"
        covers: [math/discrete/number-theory/gcd-and-euclidean-algorithm, math/discrete/number-theory/extended-euclidean-algorithm, math/discrete/number-theory/coprimality]
      - id: "8.6"
        title: "Modular arithmetic"
        covers: [math/discrete/number-theory/modular-arithmetic]
      - id: "8.10"
        title: "Euler's theorem"
        covers: [math/discrete/number-theory/euler-totient, math/discrete/number-theory/modular-exponentiation]
      - id: "8.11"
        title: "RSA"
        covers: [math/discrete/number-theory/rsa]
  - num: 9
    title: "Directed graphs and partial orders"
