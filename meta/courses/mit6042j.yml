      - id: "9.6"
        title: "Partial orders"
        covers: [math/discrete/relations/partial-orders, math/discrete/relations/properties]
      - id: "9.10"
        title: "Equivalence relations"
        covers: [math/discrete/relations/equivalence-relations, math/discrete/sets/partitions]
  - num: 10
    title: "Communication networks"
    points:
