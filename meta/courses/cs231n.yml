# Stanford CS231n course scope (meta/SPEC.md §13), drafted by Claude for owner review.
# Chapter = course-notes page in the order of the notes index (Modules 1 and 2, then the student-contributed pages); chapter 17 covers topics taught only in the Spring 2026 assignments.
# Skipped: setup and Python/NumPy/Colab tutorials, project advice, posters, the NeRF page, image features (HOG, colour histograms).
# Generated by integrate-course/scripts/gen_yaml.py.
id: cs231n
code: Stanford CS231n
name: Deep Learning for Computer Vision
institution: Stanford University
source_prefix: cs231n
outline_from: Stanford CS231n course notes (cs231n.github.io, snapshot of November 2026) and Spring 2026
  assignments
status: draft  # draft until the owner has reviewed the mapping

exclude: []

# Assignments (res-stanford-cs231n-assignments, Spring 2026): self-contained inline questions of the notebooks are
# exercises (statements verbatim, draft solutions); questions about the notebooks' own plots and experiments are skipped.
# Programming parts are coding exercises in the notes they practise (SPEC §6.4), with our own statements and tests.
# No coursework repository yet (owner to decide, SPEC §13 item 7).

