    title: Posterior, prior and Bayesian updating
    covers: [math/statistics/bayesian/bayesian-updating]
  - id: '6.2'
    title: Conjugate priors
    covers: [def-conjugate-prior, thm-beta-binomial-update, thm-normal-normal-update]
  - id: '6.3'
    title: Bayes estimators and loss functions
    covers: [def-bayes-estimator]
  - id: '6.4'
    title: Credible intervals
    covers: [def-probability-interval]
  - id: '6.5'
    title: Bayesian and frequentist inference compared
    covers: [rmk-bayes-versus-frequentist]
- num: 7
