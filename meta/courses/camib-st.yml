chapters:
- num: 1
  title: Introduction and review of distributions
  points:
  - id: '1.1'
    title: Statistical models and parametric inference
    covers: [def-statistical-model, exm-statistical-models]
  - id: '1.2'
    title: Conditional expectation, total expectation and variance
    covers: [math/probability/joint-distributions/iterated-expectations]
  - id: '1.3'
    title: Binomial and Poisson distributions
    covers: [math/probability/distributions/binomial-distribution, math/probability/distributions/poisson-distribution]
  - id: '1.4'
    title: Negative binomial distribution
    covers: [math/probability/distributions/negative-binomial-distribution]
  - id: '1.5'
    title: Multinomial distribution
    covers: [math/probability/distributions/multinomial-distribution]
  - id: '1.6'
    title: Uniform and normal distributions
    covers: [math/probability/distributions/uniform-distribution, math/probability/distributions/normal-distribution]
  - id: '1.7'
    title: Gamma, beta and chi-squared distributions
    covers: [math/probability/distributions/gamma-distribution, def-beta-distribution, def-chi-square-distribution]
- num: 2
  title: Estimation
  points:
  - id: '2.1'
    title: Estimators, bias and mean squared error
    covers: [def-estimator-properties, prp-mse-bias-variance]
  - id: '2.2'
    title: Biased estimators, unbiasedness too strong, decision theory
    covers: [math/statistics/inference/unbiased-estimators]
- num: 3
  title: Sufficiency
  points:
  - id: '3.1'
    title: Sufficient statistics and factorisation
    covers: [math/statistics/inference/sufficient-statistics]
  - id: '3.2'
    title: Minimal sufficiency
    covers: [math/statistics/inference/minimal-sufficiency]
  - id: '3.3'
    title: Rao-Blackwell theorem
    covers: [math/statistics/inference/rao-blackwell]
- num: 4
  title: Maximum likelihood estimator
  points:
  - id: '4.1'
    title: Likelihood and maximum likelihood
    covers: [def-maximum-likelihood, exm-mle-bernoulli-poisson, exm-ml-normal]
  - id: '4.2'
    title: The MLE depends only on a sufficient statistic
    covers: [prp-mle-sufficient]
  - id: '4.3'
    title: Asymptotic normality and Fisher information
    covers: [math/statistics/inference/fisher-information]
- num: 5
  title: Confidence intervals
  points:
