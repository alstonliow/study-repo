  points:
  - id: '8.1'
    title: Power functions and UMP tests
    covers: [math/statistics/inference/composite-hypotheses]
  - id: '8.2'
    title: Asymptotics of the generalised likelihood ratio
    covers: [thm-likelihood-ratio-test]
- num: 9
