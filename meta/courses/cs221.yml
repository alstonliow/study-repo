# Stanford CS221 course scope (meta/SPEC.md §13), drafted by Claude for owner review.
# Outline: the 20 technical lectures of github.com/stanford-cs221/lectures (resource
# res-stanford-cs221-lectures) in course order; chapter = lecture position, titles are our own.
# Round 0 skeleton: covers list only existing notes that overlap; new notes (plan in the
# side-session notes, owner-approved 2026-11-18) are added branch by branch in later rounds.
# AI material goes to ai/*; logic material to math/discrete/logic. Homework (res-stanford-cs221-hw): written
# parts are exercises in the notes they practise; programming parts become coursework projects (SPEC §17.13.1).
