# CS70 course scope (meta/SPEC.md §13), drafted by Claude for owner review.
# Rule (owner, same as FIT1058): content that is in the CS70 course notes is in
# scope. Content that is not in them is out of scope ("extra"), decided by
# checking the content against the notes. FIT1058-only examples and exercises
# are therefore extra here, as the CS70 examples are extra for FIT1058
# (strict rule for exercises too, confirmed by the owner on 2026-11-17).
# Only the CS70 notes kept in raw/UCB_CS70 are mapped (Notes 10, 13-19).
# Sections that cover none of our notes are left out (the exercise sections, whose
# problems sit in the notes they practise).
# Points use CS70's own numbering: chapter = CS70 note number, point = section.
# Titles are our own short titles (the resource res-ucb-cs70 has the full tree).
id: cs70
code: CS70
name: "Discrete Mathematics and Probability Theory"
institution: UC Berkeley
source_prefix: cs70-
outline_from: "UC Berkeley CS 70 Course Notes (Fall 2020), Notes 1-21 (mapped round by round)"
status: draft  # draft until the owner has reviewed the mapping

