chapters:
  - num: 1
    title: "Propositional logic"
    points:
      - id: "1.1"
        title: "Propositions and connectives"
        covers: [math/discrete/logic/propositional/propositions, math/discrete/logic/propositional/connectives, math/discrete/logic/propositional/implication-and-equivalence, math/discrete/logic/propositional/tautologies, math/discrete/logic/propositional/de-morgans-laws]
      - id: "1.2"
        title: "Quantifiers"
        covers: [math/discrete/logic/predicate/quantifiers, math/discrete/logic/predicate/multiple-quantifiers]
      - id: "1.3"
        title: "Negation"
        covers: [math/discrete/logic/predicate/logic-with-quantifiers]
  - num: 2
    title: "Proofs"
    points:
      - id: "2.3"
        title: "Direct proof"
        covers: [math/discrete/proof/theorems-and-proofs, math/discrete/proof/finding-proofs]
      - id: "2.5"
        title: "Proof by contradiction"
        covers: [math/discrete/proof/contradiction]
      - id: "2.6"
        title: "Proof by cases"
        covers: [math/discrete/proof/techniques]
  - num: 3
    title: "Mathematical induction"
    points:
      - id: "3.1"
        title: "Induction"
        covers: [math/discrete/proof/induction]
      - id: "3.2"
        title: "Strengthening the hypothesis and strong induction"
        covers: [math/discrete/proof/induction-examples]
  - num: 5
    title: "Graph theory"
    points:
      - id: "5.1"
        title: "Graphs and formal definitions"
        covers: [math/discrete/graph/basic-definitions, math/discrete/graph/degree, math/discrete/graph/walks-paths-cycles, math/discrete/graph/connectivity]
      - id: "5.2"
        title: "Eulerian tours"
        covers: [math/discrete/graph/euler-and-hamilton]
      - id: "5.3"
        title: "Planar graphs"
        covers: [math/discrete/graph/planarity]
      - id: "5.4"
        title: "Complete graphs, trees and hypercubes"
        covers: [math/discrete/graph/special-graphs, math/discrete/graph/trees]
  - num: 6
    title: "Modular arithmetic"
    points:
      - id: "6.1"
        title: "Computation and set representation"
        covers: [math/discrete/number-theory/remainders-and-parity, math/discrete/number-theory/modular-arithmetic]
      - id: "6.2"
        title: "Exponentiation"
        covers: [math/discrete/number-theory/modular-exponentiation]
      - id: "6.5"
        title: "Euclid's algorithm"
        covers: [math/discrete/number-theory/gcd-and-euclidean-algorithm, math/discrete/number-theory/extended-euclidean-algorithm]
      - id: "6.6"
        title: "Chinese remainder theorem"
        covers: [math/discrete/number-theory/chinese-remainder-theorem]
  - num: 7
    title: "Public-key cryptography: RSA"
    points:
      - id: "7"
        title: "RSA"
        covers: [math/discrete/number-theory/rsa]
  - num: 8
    title: "Polynomials"
    points:
      - id: "8"
        title: "Polynomials and secret sharing"
        covers: [math/discrete/polynomials/polynomials-and-roots, math/discrete/polynomials/interpolation, math/discrete/polynomials/finite-fields, math/discrete/polynomials/secret-sharing]
  - num: 9
    title: "Error-correcting codes"
    points:
      - id: "9"
        title: "Erasure and general errors"
        covers: [math/discrete/polynomials/erasure-codes, math/discrete/polynomials/reed-solomon-codes]
  - num: 10
    title: "Counting"
    points:
      - id: "10.1"
        title: "Counting sequences"
        covers: [math/discrete/counting/sum-and-product-rules, math/discrete/counting/selection]
      - id: "10.2"
        title: "Counting sets"
        covers: [math/discrete/counting/combinations]
      - id: "10.3"
        title: "Sampling with replacement"
        covers: [math/discrete/counting/stars-and-bars]
      - id: "10.4"
        title: "Combinatorial proofs"
        covers: [math/discrete/counting/derangements]
      - id: "10.5"
        title: "Inclusion-exclusion"
        covers: [math/discrete/counting/inclusion-exclusion]
  - num: 13
    title: "Discrete probability"
    points:
      - id: "13.1"
        title: "Random experiments"
        covers: [math/probability/discrete/sample-spaces]
      - id: "13.2"
        title: "Probability spaces"
        covers: [math/probability/discrete/events]
      - id: "13.3"
        title: "Examples"
        # poker hands, balls and bins, birthday paradox. The coin tosses and Monty
        # Hall examples are in scope through 15.2 and 14.1; listing them here would
        # place their whole notes in this point (a note goes where it is first covered).
        covers: [exm-poker-hands, exm-balls-and-bins, prob-probability-1-07]
  - num: 14
    title: "Conditional probability"
    points:
      - id: "14.1"
        title: "Conditional probability"
        covers: [math/probability/discrete/conditional-probability]
      - id: "14.3"
        title: "Bayes' rule and total probability"
        covers: [math/probability/discrete/bayes-theorem]
  - num: 15
    title: "Random variables: distribution and expectation"
    points:
      - id: "15.1"
        title: "Random variables"
        covers: [math/probability/discrete/random-variables]
      - id: "15.2"
        title: "Bernoulli, binomial and hypergeometric distributions"
        covers: [math/probability/discrete/binomial-distribution, math/probability/discrete/hypergeometric-distribution]
      - id: "15.4"
        title: "Expectation"
        covers: [math/probability/discrete/expectation-and-variance]
      - id: "15.4.3"
        title: "Applications of linearity"
        covers: [math/probability/discrete/indicator-variables]
  - num: 16
    title: "Random variables: variance and covariance"
    points:
      - id: "16.1"
        title: "Variance and the random walk"
        covers: [math/probability/discrete/covariance-and-correlation]
      - id: "16.2"
        title: "Computing variance"
        covers: [math/probability/discrete/uniform-distribution]
      - id: "16.4"
        title: "Covariance and correlation"
        covers: [math/probability/discrete/covariance-and-correlation]
  - num: 17
    title: "Concentration inequalities"
    points:
      - id: "17.1"
        title: "Markov's inequality"
        covers: [math/probability/discrete/concentration-inequalities]
      - id: "17.2"
        title: "Chebyshev's inequality"
        covers: [thm-chebyshev-s-inequality]
  - num: 18
    title: "Applications: hashing and load balancing"
    points:
      - id: "18.1"
        title: "Hashing"
        covers: [math/probability/discrete/hashing-and-load-balancing]
      - id: "18.2"
        title: "Load balancing"
        covers: [math/probability/discrete/hashing-and-load-balancing]
  - num: 19
    title: "Geometric and Poisson distributions"
    points:
      - id: "19.1"
        title: "Geometric distribution"
        covers: [math/probability/discrete/geometric-distribution, math/probability/discrete/coupon-collector]
      - id: "19.2"
        title: "Poisson distribution"
        covers: [math/probability/discrete/poisson-distribution]
