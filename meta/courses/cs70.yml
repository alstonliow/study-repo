# CS70 course scope (meta/SPEC.md §13), drafted by Claude for owner review.
# Rule (owner, same as FIT1058): content that is in the CS70 course notes is in
# scope. Content that is not in them is out of scope ("extra"), decided by
# checking the content against the notes. FIT1058-only examples and exercises
# are therefore extra here, as the CS70 examples are extra for FIT1058
# (strict rule for exercises too, confirmed by the owner on 2026-11-17).
# Only the CS70 notes kept in raw/UCB_CS70 are mapped (Notes 10, 13-19).
# Sections that cover none of our notes are left out (the exercise sections, whose
# problems sit in the notes they practise).
# Points use CS70's own numbering: chapter = CS70 note number, point = section.
# Titles are our own short titles (the resource res-ucb-cs70 has the full tree).
id: cs70
code: CS70
name: "Discrete Mathematics and Probability Theory"
institution: UC Berkeley
source_prefix: cs70-
outline_from: "UC Berkeley CS 70 Course Notes (Fall 2020), Notes 10 and 13-19 only"
status: draft  # draft until the owner has reviewed the mapping

exclude:
  # counting: FIT1058 material that CS70 Note 10 does not have
  - rmk-selection-2                                  # Counting injections
  - prp-pascal-identity                              # Pascal's identity
  - cor-ie-dual                                      # Dual form of inclusion-exclusion
  - rmk-stars-and-bars-2                             # Four different counts (summary)
  # probability: FIT1058 material that CS70 Notes 13-19 do not have
  - rmk-sample-spaces-1                              # Three sources of randomness
  - exm-infinite-sample-space                        # Infinite sample space
  - prp-difference-and-monotonicity                  # Difference and monotonicity
  - rmk-events-1                                     # remark on the block above
  - thm-ie-probability-intersection                  # Inclusion-exclusion, intersection form
  - rmk-events-3                                     # remark on the block above
  - def-median                                       # Median
  - rmk-expectation-and-variance-3                   # Median vs. mean
  - def-mode                                         # Mode
  - rmk-standard-distributions-4                     # Geometric: two conventions
  - rmk-standard-distributions-5                     # Memoryless property
  # FIT1058 worked examples whose content CS70 does not have
  - exm-sum-rule-lists
  - exm-product-rule-table
  - exm-hockey-stick
  - exm-stars-and-bars-encoding
  - exm-ie-triple-member
  - exm-derangement-cases
  - exm-sample-spaces-1
  - exm-events-1
  - exm-events-1-2
  - exm-events-2
  - exm-conditional-probability-1
  - exm-independence-can-be-subtle
  - exm-network-reliability
  - exm-conditional-probability-1-2
  - exm-three-coins
  - exm-expectation-and-variance-1-2                 # median example
  - exm-expectation-and-variance-1-3                 # mode example
  - exm-expectation-and-variance-2
  - exm-standard-distributions-1                     # uniform examples
  - exm-standard-distributions-1-2                   # binomial number example
  - exm-standard-distributions-1-3                   # Poisson number example
  - exm-standard-distributions-1-4                   # geometric number example
