# Cambridge II Statistical Modelling course scope (meta/SPEC.md §13), drafted by Claude for owner review.
# Chapter = one numbered section group of the lecturer's notes (18 units in all; the introduction, Chapter 1, and the review, Chapter 5, are omitted).
# Linear models, F-tests, ANOVA, Gauss-Markov, likelihood theory, GLM definition, link functions, Fisher scoring and IRLS, ridge and lasso, logistic regression and Pearson tests of contingency tables are reused from Cambridge IB Statistics, MIT 18.650, MIT 18.05 and CS229; only the missing material is new (16 notes).
# Example sheets 1-4 (Michaelmas 2023/2024) are added as exercises without solutions (owner instruction, 2026-11-28); the R practicals P1-P8 are registered as a resource but not added as exercises (see the resource header). The Part II lecture slides addition.pdf and the IB notes Sa4.pdf in the same folder are not used.
