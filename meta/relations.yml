# Relationship types (meta/SPEC.md §17.5). One entry per type; nothing else
# defines relationship types.
#
# name:       how the relationship is written: `relations: {<name>: [...]}` in a
#             note's YAML, or <name>="id id" on a block's div
# inverse:    shown at the target ("used by"); a display name, never written
# symmetric:  stored once, on either side; shown the same way at both ends
# acyclic:    no cycles allowed in this type's graph (check error)
# between:    which entities may be connected: notes, blocks, resources, nodes, projects
# from, to:   optional, restrict the source and the target end separately
#
# `requires` is written as the top-level `requires` field (SPEC §4).
types:
  - name: requires
    inverse: required by
    symmetric: false
    acyclic: true
    between: [notes]
  - name: uses
    inverse: used by
    symmetric: false
    acyclic: false
    between: [notes, blocks]
  - name: generalizes
    inverse: specializes
    symmetric: false
    acyclic: true
    between: [notes, blocks]
  - name: equivalent
    inverse: equivalent
    symmetric: true
    acyclic: false
    between: [notes, blocks]
  - name: related
    inverse: related
    symmetric: true
    acyclic: false
    between: [notes, blocks]
  - name: covers               # a resource or node teaches the note or block (SPEC §17.12.4):
    inverse: covered in        # "to study B, read A"; not a citation, not course placement
    symmetric: false
    acyclic: false
    from: [resources, nodes]   # `from`/`to` restrict the two ends separately (default: between)
    to: [notes, blocks]
  - name: applies              # a project puts the note or block to work (SPEC §17.13.4)
    inverse: applied in
    symmetric: false
    acyclic: false
    from: [projects]
    to: [notes, blocks]
  - name: practises            # a problem practises the note or block (SPEC §17.15.12); written on
    inverse: practised in      # question-bank problems, practises="<note id> ..."
    symmetric: false
    acyclic: false
    from: [blocks]
    to: [notes, blocks]
