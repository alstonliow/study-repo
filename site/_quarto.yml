# Quarto website project. Pages under notes/ and courses/, index.qmd,
# courses.json and the navbar/sidebar (_nav.yml) are generated by
# build/make_site.py; do not edit them by hand.
project:
  type: website
  output-dir: _site
  resources:
    - courses.json

metadata-files:
  - _nav.yml

website:
  title: "Study Notes"
  favicon: favicon.svg
  site-url: https://alstonliow.github.io/study-repo/
  repo-url: https://github.com/alstonliow/study-repo
  search: true
  page-navigation: true
  page-footer:
    center: "Notes CC BY-NC-SA 4.0. Third-party problem statements remain the copyright of their authors."

format:
  html:
    theme:
      light: [cosmo, theme-light.scss]
      dark: [cosmo, theme-dark.scss]
    css: styles.css
    include-after-body: filter.html
    filters:
      - list-delims.lua
    toc: true
    toc-depth: 2
    html-math-method: mathjax
    crossref:
      chapters: false
