# Quarto website project. Pages under notes/ and the sidebar (_sidebar.yml)
# are generated by build/make_site.py; do not edit them by hand.
project:
  type: website
  output-dir: _site

metadata-files:
  - _sidebar.yml

website:
  title: "Study Notes"
  search: true
  page-navigation: true
  navbar:
    left:
      - href: index.qmd
        text: Home
  page-footer:
    center: "Notes CC BY-NC-SA 4.0. Third-party problem statements remain the copyright of their authors."

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    toc-depth: 2
    html-math-method: mathjax
    crossref:
      chapters: false
