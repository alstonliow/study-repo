# Quarto website project. Hand-written files are this file and _assets/
# (themes, styles, scripts included in every page, the Lua filter, the favicon).
# Everything else in site/ is generated by build/make_site.py and quarto render
# and is not committed (see site/.gitignore); do not edit it by hand.
project:
  type: website
  output-dir: _site
  resources:
    - site-data.json
    - pdf/*.pdf

metadata-files:
  - _nav.yml

website:
  title: "Study Notes"
  favicon: _assets/favicon.svg
  site-url: https://alstonliow.github.io/study-repo/
  repo-url: https://github.com/alstonliow/study-repo
  search: true
  page-navigation: true
  page-footer:
    center: "Notes CC BY-NC-SA 4.0. Third-party problem statements remain the copyright of their authors."

format:
  html:
    theme:
      light: [cosmo, _assets/theme-light.scss]
      dark: [cosmo, _assets/theme-dark.scss]
    css: _assets/styles.css
    include-after-body:
      - _assets/site-data.html
      - _assets/filter.html
      - _assets/progress.html
      - _assets/summary.html
      - _assets/export-builder.html
      - _assets/pseudocode.html
    filters:
      - _assets/list-delims.lua
    grid:
      sidebar-width: 270px
      body-width: 1000px
      margin-width: 240px
      gutter-width: 2rem
    toc: true
    toc-depth: 2
    html-math-method: mathjax
    crossref:
      chapters: false
