<!-- Progress tracking. Every knowledge point and exercise has a mark with four
     states: New -> Learned -> Reviewing -> Mastered (click to advance,
     shift-click to go back). Marks are kept in this browser (localStorage).
     When SUPABASE_URL and SUPABASE_ANON_KEY are set, signing in with GitHub
     syncs them through the `progress` table (schema: build/supabase-schema.sql).
     The anon key is public by design; row-level security protects the data.
     Data: progress.json, generated by build/make_site.py. -->
<script>
window.STUDY_PROGRESS_CONFIG = {
  SUPABASE_URL: "",       // e.g. https://abcd1234.supabase.co
  SUPABASE_ANON_KEY: "",  // the "anon public" key, never the service_role key
};
</script>
<style>
  :root { --pg-new: #9a9a9a; --pg-learned: #3b6ea5; --pg-reviewing: #b07a1f; --pg-mastered: #4e8a5a; }
  body.quarto-dark { --pg-new: #7d8188; --pg-learned: #8db1dc; --pg-reviewing: #d9b061; --pg-mastered: #93c49e; }
  .pg-dot { display: inline-block; width: 0.5em; height: 0.5em; border-radius: 50%; vertical-align: 0.1em;
            border: 1.5px solid var(--pg-new); box-sizing: border-box; flex: none; }
  .pg-dot[data-state="learned"]   { background: var(--pg-learned);   border-color: var(--pg-learned); }
  .pg-dot[data-state="reviewing"] { background: var(--pg-reviewing); border-color: var(--pg-reviewing); }
  .pg-dot[data-state="mastered"]  { background: var(--pg-mastered);  border-color: var(--pg-mastered); }
  .pg-mark { display: inline-flex; align-items: center; gap: 0.35em; padding: 0.1em 0.5em; cursor: pointer;
             font: 600 0.68rem/1.6 "Source Sans 3", system-ui, sans-serif; letter-spacing: 0.06em; text-transform: uppercase;
             color: var(--pg-new); background: none; border: 1px solid var(--rule, #ddd); border-radius: 3px; }
  .pg-mark:hover { border-color: currentColor; }
  .pg-mark[data-state="learned"]   { color: var(--pg-learned); }
  .pg-mark[data-state="reviewing"] { color: var(--pg-reviewing); }
  .pg-mark[data-state="mastered"]  { color: var(--pg-mastered); }
  .pg-note-row { margin: 0.5rem 0 0.2rem; }
  .problem .pg-mark { float: right; margin-left: 0.6em; }
  #quarto-sidebar .pg-dot { margin-right: 0.45em; width: 0.45em; height: 0.45em; }
  .branch-toc .pg-dot { margin-right: 0.45em; }
  .pg-summary { font: 0.8rem/1.5 "Source Sans 3", system-ui, sans-serif; color: var(--notec, #777); margin: -0.8rem 0 1.4rem; }
  .pg-bar { display: flex; height: 3px; margin-top: 0.35rem; background: var(--rule, #e2ddd2); border-radius: 2px; overflow: hidden; max-width: 22rem; }
  .pg-bar span { display: block; height: 100%; }
  .pg-count { display: block; margin-top: 0.1rem; font-family: "Source Sans 3", system-ui, sans-serif; font-size: 0.78rem; color: var(--notec, #777); }
  .contents-list .pg-count { padding-left: 1.8rem; }
  .pg-auth { margin: 0.4rem 0 1rem; font: 0.8rem/1.5 "Source Sans 3", system-ui, sans-serif; color: #7A7A7A; }
  .pg-auth button { padding: 0; border: none; background: none; color: inherit; text-decoration: underline; cursor: pointer; font: inherit; }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
(function () {
  const STATES = ["new", "learned", "reviewing", "mastered"];
  const LABEL = { new: "New", learned: "Learned", reviewing: "Reviewing", mastered: "Mastered" };
  const KEY = "study-progress";
  const cfg = window.STUDY_PROGRESS_CONFIG || {};
  const offsetMeta = document.querySelector('meta[name="quarto:offset"]');
  const root = new URL(offsetMeta ? offsetMeta.content : "./", window.location.href);

  // ---------- local store: { item: { s: state, t: ms } } ----------
  function load() {
    try { return JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) { return {}; }
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) { /* private mode */ }
  }
  let store = load();
  const stateOf = item => (store[item] && store[item].s) || "new";

  // ---------- remote (Supabase) ----------
  let db = null, session = null;
  if (cfg.SUPABASE_URL && cfg.SUPABASE_ANON_KEY && window.supabase) {
    db = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);
  }
  async function push(items) {
    if (!db || !session || !items.length) return;
    const rows = items.map(i => ({ item: i, state: store[i].s, updated_at: new Date(store[i].t).toISOString() }));
    const { error } = await db.from("progress").upsert(rows, { onConflict: "user_id,item" });
    if (error) console.warn("progress sync failed:", error.message);
  }
  async function pull() {
    if (!db || !session) return;
    const { data, error } = await db.from("progress").select("item,state,updated_at");
    if (error) { console.warn("progress sync failed:", error.message); return; }
    const remote = {};
    for (const r of data) remote[r.item] = { s: r.state, t: Date.parse(r.updated_at) };
    const toPush = [];
    for (const [i, v] of Object.entries(remote)) {
      if (!store[i] || store[i].t < v.t) store[i] = v;
    }
    for (const [i, v] of Object.entries(store)) {
      if (!remote[i] || remote[i].t < v.t) toPush.push(i);
    }
    save();
    render();
    await push(toPush);
  }

  function setState(item, s) {
    store[item] = { s: s, t: Date.now() };
    save();
    render();
    push([item]);
  }

  // ---------- page helpers ----------
  function sitePath(href) {
    const u = new URL(href, window.location.href);
    let p = u.pathname.startsWith(root.pathname) ? u.pathname.slice(root.pathname.length) : u.pathname;
    if (p === "" || p.endsWith("/")) p += "index.html";
    return p;
  }
  function noteIdOf(href) {
    const m = sitePath(href).match(/^notes\/(.+)\.html$/);
    return m && !m[1].endsWith("/index") && m[1] !== "index" ? m[1] : null;
  }
  function branchIdOf(href) {
    const m = sitePath(href).match(/^notes\/(.+)\/index\.html$/);
    return m ? m[1] : null;
  }
  function dot(item) {
    const d = document.createElement("span");
    d.className = "pg-dot";
    d.dataset.item = item;
    return d;
  }
  function mark(item) {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "pg-mark";
    b.dataset.item = item;
    b.title = "Click to advance, shift-click to go back";
    b.addEventListener("click", ev => {
      const k = STATES.indexOf(stateOf(item));
      const next = ev.shiftKey ? (k + STATES.length - 1) % STATES.length : (k + 1) % STATES.length;
      setState(item, STATES[next]);
    });
    b.innerHTML = '<span class="pg-dot"></span><span class="pg-label"></span>';
    return b;
  }

  function tally(items) {
    const c = { new: 0, learned: 0, reviewing: 0, mastered: 0 };
    items.forEach(i => c[stateOf(i)]++);
    return c;
  }
  function summaryText(c, total, noun) {
    const done = total - c.new;
    if (!total) return "";
    return `${noun}: ${done}/${total} studied` +
      (c.mastered ? ` · ${c.mastered} mastered` : "") +
      (c.reviewing ? ` · ${c.reviewing} reviewing` : "") +
      (c.learned ? ` · ${c.learned} learned` : "");
  }
  function bar(c, total) {
    const b = document.createElement("div");
    b.className = "pg-bar";
    ["mastered", "reviewing", "learned"].forEach(s => {
      const seg = document.createElement("span");
      seg.style.width = (100 * c[s] / total) + "%";
      seg.style.background = `var(--pg-${s})`;
      b.appendChild(seg);
    });
    return b;
  }

  let data = null;
  const summaries = [];   // {el, bid}
  const counts = [];      // {el, bid}

  function render() {
    document.querySelectorAll(".pg-dot[data-item]").forEach(d => { d.dataset.state = stateOf(d.dataset.item); });
    document.querySelectorAll(".pg-mark").forEach(b => {
      const s = stateOf(b.dataset.item);
      b.dataset.state = s;
      b.querySelector(".pg-dot").dataset.state = s;
      b.querySelector(".pg-label").textContent = LABEL[s];
    });
    if (!data) return;
    summaries.forEach(({ el, bid }) => {
      const notes = data.branches[bid] || [];
      const probs = notes.flatMap(n => data.notes[n] || []);
      const cn = tally(notes), cp = tally(probs);
      el.innerHTML = "";
      const t1 = document.createElement("div");
      t1.textContent = [summaryText(cn, notes.length, "Topics"), summaryText(cp, probs.length, "Exercises")]
        .filter(Boolean).join("  ·  ");
      el.appendChild(t1);
      if (notes.length) el.appendChild(bar(cn, notes.length));
    });
    counts.forEach(({ el, bid }) => {
      const notes = data.branches[bid] || [];
      const c = tally(notes);
      const done = notes.length - c.new;
      el.textContent = done ? `${done}/${notes.length} studied` + (c.mastered ? ` · ${c.mastered} mastered` : "") : "";
    });
  }

  function decorate() {
    // current knowledge point: mark under the title
    const here = noteIdOf(window.location.href);
    const title = document.querySelector("#title-block-header h1.title");
    if (here && title) {
      const row = document.createElement("div");
      row.className = "pg-note-row";
      row.appendChild(mark(here));
      title.insertAdjacentElement("afterend", row);
    }
    // exercises
    document.querySelectorAll('.problem[id^="prob-"]').forEach(p => {
      const t = p.querySelector(".problem-title");
      const host = t ? t.parentElement : p;
      host.insertBefore(mark(p.id), host.firstChild);
    });
    // sidebar
    document.querySelectorAll("#quarto-sidebar a.sidebar-link").forEach(a => {
      const id = noteIdOf(a.getAttribute("href") || "");
      const text = a.querySelector(".menu-text");
      if (id && text) text.insertBefore(dot(id), text.firstChild);
    });
    // branch page: dots and summary
    document.querySelectorAll(".branch-toc li > a").forEach(a => {
      const id = noteIdOf(a.getAttribute("href") || "");
      if (id) a.insertBefore(dot(id), a.firstChild);
    });
    const intro = document.querySelector(".branch-intro");
    const bid = branchIdOf(window.location.href);
    if (intro && bid) {
      const el = document.createElement("div");
      el.className = "pg-summary";
      (intro.closest("p") || intro).insertAdjacentElement("afterend", el);
      summaries.push({ el, bid });
    }
    // home page: per-branch counts
    document.querySelectorAll(".contents-list li > a").forEach(a => {
      const b = branchIdOf(a.getAttribute("href") || "");
      if (!b) return;
      const el = document.createElement("span");
      el.className = "pg-count";
      a.parentElement.appendChild(el);
      counts.push({ el, bid: b });
    });
  }

  // ---------- sign-in line at the bottom of the sidebar ----------
  function authLine() {
    const host = document.querySelector("#quarto-sidebar .sidebar-menu-container");
    if (!host) return;
    const box = document.createElement("div");
    box.className = "pg-auth";
    host.appendChild(box);
    const draw = () => {
      box.innerHTML = "";
      if (!db) { box.textContent = "Progress is saved in this browser."; return; }
      if (session) {
        const meta = session.user.user_metadata || {};
        box.append(`Progress synced as ${meta.user_name || meta.name || "you"} · `);
        const out = document.createElement("button");
        out.textContent = "Sign out";
        out.onclick = async () => { await db.auth.signOut(); };
        box.appendChild(out);
      } else {
        box.append("Progress is saved in this browser. ");
        const inb = document.createElement("button");
        inb.textContent = "Sign in with GitHub to sync";
        inb.onclick = () => db.auth.signInWithOAuth({
          provider: "github",
          options: { redirectTo: window.location.href.split("#")[0] },
        });
        box.appendChild(inb);
      }
    };
    draw();
    if (db) {
      db.auth.onAuthStateChange((_event, s) => {
        const was = session && session.user.id;
        session = s;
        draw();
        if (s && s.user.id !== was) pull();
      });
    }
  }

  // another tab changed the marks
  window.addEventListener("storage", e => { if (e.key === KEY) { store = load(); render(); } });

  function start() {
    decorate();
    authLine();
    render();
    fetch(new URL("progress.json", root))
      .then(r => r.ok ? r.json() : null)
      .then(d => { data = d; render(); })
      .catch(() => {});
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", start);
  else start();
})();
</script>
