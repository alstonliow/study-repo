<!-- Runnable Python code blocks (SPEC §5.9): ```{.python .runnable packages="numpy"}.
     Wraps each block in a cell with a Run / Edit / Reset bar and an output panel.
     Pyodide (pinned) loads from the CDN on the first Run only; each run gets a
     fresh namespace; runs are queued. Ctrl/Cmd+Enter runs while editing.
     Colours come from the theme variables of styles.css. Hidden bar in print.
     Coding exercises (SPEC §6.4): a .problem-group[data-kind="code"] gets an
     editor that starts from the starter (the reader's code is kept per exercise
     in localStorage), Run tests (each test passed / failed) and Reset. Pages
     with coding exercises get an All / Written / Code filter above them.
     The solution of a coding exercise opens on the approach (the numbered
     steps); its code is folded under "Show the code", with "Run tests on it"
     and "Load into editor" (asks before replacing the reader's own code). -->
<style>
.run-cell { border: 1px solid var(--rule); border-radius: 6px; margin: 1rem 0; overflow: hidden; }
.run-cell div.sourceCode, .run-cell pre.sourceCode { margin: 0 !important; border: 0 !important; border-radius: 0 !important; }
.run-edit { display: block; width: 100%; border: 0; resize: vertical; padding: .6rem .8rem; margin: 0;
  font-family: var(--bs-font-monospace); font-size: .875em; line-height: 1.5; tab-size: 4;
  background: color-mix(in srgb, var(--accent) var(--tint), transparent); color: inherit; outline: none; }
.run-bar { display: flex; align-items: center; gap: .35rem; padding: .3rem .5rem;
  border-top: 1px solid var(--rule); background: var(--sidebg); font-size: .8rem; }
.run-bar button { font: inherit; line-height: 1.4; padding: .15rem .6rem; border-radius: 4px; cursor: pointer;
  border: 1px solid var(--rule); background: transparent; color: inherit; }
.run-bar button:hover { border-color: var(--accent); color: var(--accent); }
.run-bar button.run-go { background: var(--accent); border-color: var(--accent); color: var(--sidebg); font-weight: 600; }
.run-bar button.run-go:hover { filter: brightness(1.1); color: var(--sidebg); }
.run-bar button:disabled { opacity: .6; cursor: wait; }
.run-meta { margin-left: auto; opacity: .65; font-family: var(--bs-font-monospace); }
.run-out { border-top: 1px solid var(--rule); padding: .5rem .8rem; }
.run-out::before { content: "Output"; display: block; font-size: .7rem; letter-spacing: .06em;
  text-transform: uppercase; opacity: .6; margin-bottom: .2rem; }
.run-out pre { margin: 0; padding: 0; border: 0; background: none; white-space: pre-wrap;
  font-size: .85em; max-height: 24rem; overflow: auto; }
.run-out.busy pre { opacity: .65; font-style: italic; }
.run-out.err { border-left: 3px solid var(--bs-danger); }
.run-out.err pre { color: var(--bs-danger); }
@media print { .run-bar, .run-edit, .run-out { display: none !important; } .run-cell { border: 0; } }
.code-badge { margin-left: 0.6em; font-size: 0.72em; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase;
  color: var(--accent); border: 1px solid currentColor; border-radius: 3px; padding: 0 .35em; }
.coding-cell { margin: .8rem 0; }
.coding-cell .run-edit { min-height: 8rem; }
.coding-tests > details > summary { cursor: pointer; font-size: .85em; color: var(--notec); margin: .3rem 0; }
.coding-results { list-style: none; margin: 0; padding: 0; font-family: var(--bs-font-monospace); font-size: .85em; }
.coding-results li { padding: .05rem 0; white-space: pre-wrap; }
.coding-results li.ok::before { content: "\2713  "; color: var(--bs-success); font-weight: 700; }
.coding-results li.bad::before { content: "\2717  "; color: var(--bs-danger); font-weight: 700; }
.coding-results li.bad .msg { color: var(--bs-danger); }
.coding-total { margin-top: .3rem; font-size: .85em; font-weight: 600; }
.exercise-kind-filter { display: flex; gap: .35rem; margin: .4rem 0 1rem; font-size: .8rem; }
.exercise-kind-filter button { font: inherit; padding: .1rem .7rem; border-radius: 999px; cursor: pointer;
  border: 1px solid var(--rule); background: transparent; color: inherit; }
.exercise-kind-filter button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--sidebg); }
.kind-hidden { display: none !important; }
.sol-label { font-size: .7rem; letter-spacing: .06em; text-transform: uppercase; opacity: .6; margin: .2rem 0 .3rem; }
details.sol-code { margin: .6rem 0 .2rem; }
details.sol-code > summary { cursor: pointer; font-size: .85em; font-weight: 600; color: var(--accent); margin: .2rem 0 .4rem; }
details.sol-code .run-cell { margin: .4rem 0 0; }
@media print { details.sol-code > summary, details.sol-code .run-bar, details.sol-code .run-out { display: none !important; } }
@media print { .exercise-kind-filter, .coding-cell .run-bar, .coding-cell .run-edit, .coding-cell .run-out { display: none !important; }
  .coding-starter { display: block !important; } }
</style>
<script>
(() => {
  const PYODIDE = "https://cdn.jsdelivr.net/pyodide/v0.26.4/full/";
  let ready = null;                      // one Pyodide per page, loaded lazily
  const loaded = new Set();
  function pyodide() {
    if (!ready) ready = new Promise((ok, fail) => {
      const s = document.createElement("script");
      s.src = PYODIDE + "pyodide.js";
      s.onload = () => loadPyodide({ indexURL: PYODIDE }).then(async py => {
        await py.loadPackage("micropip"); ok(py);
      }, fail);
      s.onerror = () => { ready = null; fail(new Error("Could not load Python (offline?)")); };
      document.head.appendChild(s);
    });
    return ready;
  }
  let queue = Promise.resolve();         // runs share stdout, so one at a time
  function run(cell) {
    cell.go.disabled = true;
    queue = queue.then(() => runNow(cell)).finally(() => { cell.go.disabled = false; });
  }
  async function runNow({ code, packages, out, text }) {
    const show = (msg, cls) => { out.className = "run-out " + (cls || ""); out.hidden = false; text.textContent = msg; };
    show(ready ? "Running…" : "Loading Python (first run only)…", "busy");
    try {
      const py = await pyodide();
      const need = packages.filter(p => !loaded.has(p));
      if (need.length) {
        show("Installing " + need.join(", ") + "…", "busy");
        await py.pyimport("micropip").install(need);
        need.forEach(p => loaded.add(p));
      }
      let buf = "";
      py.setStdout({ batched: s => { buf += s + "\n"; } });
      py.setStderr({ batched: s => { buf += s + "\n"; } });
      show("Running…", "busy");
      const ns = py.globals.get("dict")();
      const t0 = performance.now();
      try { await py.runPythonAsync(code(), { globals: ns }); } finally { ns.destroy(); }
      show(buf.replace(/\n$/, "") || "(no output)");
      out.title = `ran in ${Math.round(performance.now() - t0)} ms`;
    } catch (e) {
      const lines = String(e.message || e).split("\n").filter(l => l.trim());
      const own = lines.findIndex(l => l.includes('File "<exec>"'));   // drop Pyodide's own frames
      show((own >= 0 ? lines.slice(own) : lines.slice(-4)).join("\n"), "err");
    }
  }
  function button(label, title, onclick) {
    const b = document.createElement("button");
    b.type = "button"; b.textContent = label; b.title = title; b.onclick = onclick; return b;
  }
  document.addEventListener("DOMContentLoaded", () => {
    document.querySelectorAll("pre.runnable").forEach(pre => {
      const block = pre.closest("div.sourceCode") || pre;
      const holder = pre.closest("[data-packages]") || block.querySelector("[data-packages]");
      const packages = ((holder && holder.dataset.packages) || "").split(",").map(s => s.trim()).filter(Boolean);
      const original = pre.querySelector("code").textContent;
      const box = document.createElement("div");
      box.className = "run-cell";
      block.before(box);
      const edit = document.createElement("textarea");
      edit.className = "run-edit"; edit.hidden = true; edit.spellcheck = false;
      const out = document.createElement("div");
      out.hidden = true;
      const text = out.appendChild(document.createElement("pre"));
      const bar = document.createElement("div");
      bar.className = "run-bar";
      const cell = { packages, out, text, code: () => edit.hidden ? original : edit.value };
      cell.go = button("▶ Run", "Run this code in your browser", () => run(cell));
      cell.go.className = "run-go";
      const meta = document.createElement("span");
      meta.className = "run-meta";
      meta.textContent = ["Python", ...packages].join(" · ");
      const editing = on => { edit.hidden = !on; block.hidden = on; };
      bar.append(cell.go,
        button("Edit", "Change the code, then run it", () => {
          if (edit.hidden) { edit.value = cell.code(); edit.rows = Math.min(30, edit.value.split("\n").length + 1); }
          editing(true); edit.focus();
        }),
        button("Reset", "Back to the original code", () => { editing(false); out.hidden = true; }),
        meta);
      edit.addEventListener("keydown", e => {
        if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); run(cell); }
        if (e.key === "Tab" && !e.shiftKey) { e.preventDefault(); edit.setRangeText("    ", edit.selectionStart, edit.selectionEnd, "end"); }
      });
      box.append(block, edit, bar, out);
    });
  });
  // ------------------------------------------------ coding exercises (SPEC §6.4)
  // HARNESS is the twin of build/coding.py (HARNESS): run the code, then the tests;
  // top-level statements of the tests are one test, then each test_* function.
  const HARNESS = `
import json
ns = {"__name__": "__exercise__"}
out = []
def fail(e):
    return f"{type(e).__name__}: {e}" if str(e) else type(e).__name__
try:
    exec(compile(__code, "<code>", "exec"), ns)
except BaseException as e:
    out.append(["(your code)", False, fail(e)])
else:
    try:
        exec(compile(__tests, "<tests>", "exec"), ns)
        top = None
    except BaseException as e:
        top = fail(e)
    tests = [v for k, v in ns.items() if k.startswith("test_") and callable(v)
             and getattr(getattr(v, "__code__", None), "co_filename", "") == "<tests>"]
    if top is not None or not tests:
        out.append(["(top level)", top is None, top or ""])
    for t in tests:
        try:
            t()
            out.append([t.__name__, True, ""])
        except BaseException as e:
            out.append([t.__name__, False, fail(e)])
json.dumps(out)
`;
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* private mode */ } },
    del(k) { try { localStorage.removeItem(k); } catch (e) { /* private mode */ } },
  };
  async function runTests(cell) {
    const { tests, packages, out, list, total } = cell;
    const show = (msg, cls) => { out.hidden = false; out.className = "run-out " + (cls || ""); total.textContent = msg; };
    list.replaceChildren();
    show(ready ? "Running tests…" : "Loading Python (first run only)…", "busy");
    try {
      const py = await pyodide();
      const need = packages.filter(p => !loaded.has(p));
      if (need.length) {
        show("Installing " + need.join(", ") + "…", "busy");
        await py.pyimport("micropip").install(need);
        need.forEach(p => loaded.add(p));
      }
      let buf = "";
      py.setStdout({ batched: s => { buf += s + "\n"; } });
      py.setStderr({ batched: s => { buf += s + "\n"; } });
      const ns = py.globals.get("dict")();
      ns.set("__code", cell.code()); ns.set("__tests", tests);
      let res;
      try { res = JSON.parse(await py.runPythonAsync(HARNESS, { globals: ns })); } finally { ns.destroy(); }
      for (const [name, ok, msg] of res) {
        const li = document.createElement("li");
        li.className = ok ? "ok" : "bad";
        li.append(name);
        if (msg) { const m = document.createElement("span"); m.className = "msg"; m.textContent = "  " + msg; li.append(m); }
        list.append(li);
      }
      const good = res.filter(r => r[1]).length;
      show(good === res.length ? `All ${res.length} tests passed.` : `${good} of ${res.length} tests passed.`,
           good === res.length ? "" : "err");
      if (buf.trim()) total.textContent += "\nOutput:\n" + buf.replace(/\n$/, "");
    } catch (e) {
      show(String(e.message || e).split("\n").filter(l => l.trim()).slice(-4).join("\n"), "err");
    }
  }
  function codingCell(group) {
    const pid = group.dataset.item;
    const starterBox = group.querySelector(".coding-starter");
    const testsBox = group.querySelector(".coding-tests");
    if (!starterBox || !testsBox) return;
    const starter = starterBox.querySelector("code").textContent;
    const tests = testsBox.querySelector("code").textContent;
    const packages = (group.dataset.packages || "").split(",").map(s => s.trim()).filter(Boolean);
    const key = "study-code:" + pid;
    const box = document.createElement("div");
    box.className = "run-cell coding-cell";
    const edit = document.createElement("textarea");
    edit.className = "run-edit"; edit.spellcheck = false;
    edit.value = store.get(key) ?? starter;
    edit.rows = Math.min(30, Math.max(starter.split("\n").length, edit.value.split("\n").length) + 1);
    edit.setAttribute("aria-label", "Your code");
    const out = document.createElement("div");
    out.hidden = true;
    const list = out.appendChild(document.createElement("ul"));
    list.className = "coding-results";
    const total = out.appendChild(document.createElement("pre"));
    total.className = "coding-total";
    const cell = { edit, tests, packages, out, list, total, code: () => edit.value };
    const bar = document.createElement("div");
    bar.className = "run-bar";
    cell.go = button("▶ Run tests", "Run your code, then the tests, in your browser", () => {
      cell.go.disabled = true;
      queue = queue.then(() => runTests(cell)).finally(() => { cell.go.disabled = false; });
    });
    cell.go.className = "run-go";
    const meta = document.createElement("span");
    meta.className = "run-meta";
    meta.textContent = ["Python", ...packages].join(" · ");
    bar.append(cell.go, button("Reset", "Back to the starter code (your code is discarded)", () => {
      edit.value = starter; store.del(key); out.hidden = true;
    }), meta);
    edit.addEventListener("input", () => {
      if (edit.value === starter) store.del(key); else store.set(key, edit.value);
    });
    edit.addEventListener("keydown", e => {
      if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); cell.go.click(); }
      if (e.key === "Tab" && !e.shiftKey) { e.preventDefault(); edit.setRangeText("    ", edit.selectionStart, edit.selectionEnd, "end"); edit.dispatchEvent(new Event("input")); }
    });
    box.append(edit, bar, out);
    starterBox.hidden = true;                 // shown again in print
    starterBox.before(box);
    // the tests: folded under a summary line
    const det = document.createElement("details");
    const sum = det.appendChild(document.createElement("summary"));
    sum.textContent = "Tests";
    while (testsBox.firstChild) det.append(testsBox.firstChild);
    testsBox.append(det);
    solutionPanel(group, cell, starter, key);
  }
  // The solution: approach first, code folded, with Run tests on it / Load into editor.
  function solutionPanel(group, mine, starter, key) {
    const body = group.querySelector(".callout .callout-body");
    const src = body && body.querySelector("div.sourceCode");
    if (!src) return;
    const code = src.querySelector("code").textContent;
    const block = src.closest(".code-copy-outer-scaffold") || src;
    const steps = [];
    for (let n = block.nextElementSibling; n; n = n.nextElementSibling) steps.push(n);
    if (steps.length) {
      const label = document.createElement("div");
      label.className = "sol-label"; label.textContent = "Approach";
      block.before(label, ...steps);
    }
    const det = document.createElement("details");
    det.className = "sol-code";
    const sum = det.appendChild(document.createElement("summary"));
    sum.textContent = steps.length ? "Show the code" : "Show the solution code";
    block.before(det);
    const box = document.createElement("div");
    box.className = "run-cell";
    const out = document.createElement("div");
    out.hidden = true;
    const list = out.appendChild(document.createElement("ul"));
    list.className = "coding-results";
    const total = out.appendChild(document.createElement("pre"));
    total.className = "coding-total";
    const cell = { tests: mine.tests, packages: mine.packages, out, list, total, code: () => code };
    const bar = document.createElement("div");
    bar.className = "run-bar";
    cell.go = button("▶ Run tests on it", "Run this solution, then the tests, in your browser", () => {
      cell.go.disabled = true;
      queue = queue.then(() => runTests(cell)).finally(() => { cell.go.disabled = false; });
    });
    cell.go.className = "run-go";
    bar.append(cell.go, button("Load into editor", "Put this solution in the editor above", () => {
      const e = mine.edit;
      if (e.value !== starter && e.value !== code &&
          !confirm("Replace your code in the editor with the solution? Your code is discarded.")) return;
      e.value = code; store.set(key, code); mine.out.hidden = true;
      e.rows = Math.min(30, code.split("\n").length + 1);
      e.scrollIntoView({ block: "center", behavior: "smooth" }); e.focus();
    }));
    box.append(block, bar, out);
    det.append(box);
  }
  window.addEventListener("beforeprint", () => document.querySelectorAll("details.sol-code").forEach(d => { d.open = true; }));
  function kindFilter() {
    const groups = [...document.querySelectorAll(".problem-group[data-kind]")];
    if (!groups.some(g => g.dataset.kind === "code")) return;
    const bar = document.createElement("div");
    bar.className = "exercise-kind-filter";
    bar.setAttribute("role", "group");
    bar.setAttribute("aria-label", "Show exercises");
    const choices = [["all", "All"], ["written", "Written"], ["code", "Code"]];
    const buttons = choices.map(([k, label]) => {
      const b = button(label, `Show ${label.toLowerCase()} exercises`, () => pick(k));
      b.dataset.kind = k; return b;
    });
    function pick(k) {
      buttons.forEach(b => b.setAttribute("aria-pressed", String(b.dataset.kind === k)));
      groups.forEach(g => g.classList.toggle("kind-hidden", k !== "all" && g.dataset.kind !== k));
    }
    bar.append(...buttons);
    groups[0].before(bar);
    pick("all");
  }
  document.addEventListener("DOMContentLoaded", () => {
    document.querySelectorAll('.problem-group[data-kind="code"]').forEach(codingCell);
    kindFilter();
  });
})();
</script>
