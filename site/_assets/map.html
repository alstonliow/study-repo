<!-- Map of topics (map.qmd, generated by build/web.py map_page) and hover
     tracing on the note-level prerequisite graphs (build/graphs.py).
     Map: cards fade in, part-to-part lines draw themselves, hovering a card
     highlights what it needs and what it leads to, branches open in place,
     search and field filters dim what does not match, progress rings and
     bars follow the marks of progress.html (window.StudyProgress).
     All motion is off under prefers-reduced-motion. Styles: styles.css. -->
<script>
(function () {
  const still = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const SVGNS = "http://www.w3.org/2000/svg";

  // ---------------------------------------------------------------- note graphs (effect 9)
  function traceGraphs() {
    document.querySelectorAll("svg.dep-graph").forEach(svg => {
      const paths = [...svg.querySelectorAll("path.dep-edge[data-a]")];
      if (!paths.length) return;
      const succ = {}, pred = {};
      paths.forEach(p => {
        const a = p.dataset.a, b = p.dataset.b;
        (succ[a] = succ[a] || []).push(b);
        (pred[b] = pred[b] || []).push(a);
      });
      const walk = (start, next) => {
        const seen = new Set(), stack = [...(next[start] || [])];
        while (stack.length) {
          const x = stack.pop();
          if (!seen.has(x)) { seen.add(x); stack.push(...(next[x] || [])); }
        }
        return seen;
      };
      const nodes = [...svg.querySelectorAll(".dep-node[data-item]")];
      const clear = () => {
        svg.classList.remove("tracing");
        nodes.forEach(n => n.classList.remove("on", "up", "down"));
        paths.forEach(p => p.classList.remove("on", "up", "down"));
      };
      nodes.forEach(n => {
        const id = n.getAttribute("data-item");
        const show = () => {
          const up = walk(id, pred), down = walk(id, succ);
          svg.classList.add("tracing");
          nodes.forEach(m => {
            const k = m.getAttribute("data-item");
            m.classList.toggle("on", k === id);
            m.classList.toggle("up", up.has(k));
            m.classList.toggle("down", down.has(k));
          });
          paths.forEach(p => {
            const a = p.dataset.a, b = p.dataset.b;
            const isUp = (b === id || up.has(b)) && up.has(a);
            const isDown = (a === id || down.has(a)) && down.has(b);
            p.classList.toggle("up", isUp);
            p.classList.toggle("down", isDown);
          });
        };
        n.addEventListener("mouseenter", show);
        n.addEventListener("focus", show);
        n.addEventListener("mouseleave", clear);
        n.addEventListener("blur", clear);
      });
    });
  }

  // ---------------------------------------------------------------- the map
  function initMap(root) {
    const stage = root.querySelector(".tmap-stage");
    const layer = root.querySelector(".tmap-edges");
    const cards = [...root.querySelectorAll(".tmap-card")];
    const byId = Object.fromEntries(cards.map(c => [c.id, c]));
    const edges = JSON.parse(root.querySelector("#tmap-data").textContent).edges
      .filter(([a, b]) => byId[a] && byId[b])
      .map(([a, b, w, core]) => ({ a, b, w, core, el: null }));
    const out = {}, inn = {};
    edges.forEach(e => { (out[e.a] = out[e.a] || []).push(e); (inn[e.b] = inn[e.b] || []).push(e); });

    // effect 1: staggered entrance
    requestAnimationFrame(() => root.classList.add("ready"));

    // ---- lines between cards
    edges.forEach(e => {
      const p = document.createElementNS(SVGNS, "path");
      p.setAttribute("class", "tmap-edge" + (e.core ? " core" : ""));
      p.style.strokeWidth = (1 + Math.log2(e.w) * 0.8).toFixed(2);
      const t = document.createElementNS(SVGNS, "title");
      t.textContent = `${byId[e.a].querySelector("h3").textContent} → ${byId[e.b].querySelector("h3").textContent}: ${e.w} link${e.w > 1 ? "s" : ""}`;
      p.appendChild(t);
      layer.appendChild(p);
      e.el = p;
    });

    function box(c) {
      const s = stage.getBoundingClientRect(), r = c.getBoundingClientRect();
      return { x: r.left - s.left, y: r.top - s.top, w: r.width, h: r.height };
    }
    function draw() {
      const s = stage.getBoundingClientRect();
      layer.setAttribute("width", s.width);
      layer.setAttribute("height", s.height);
      layer.setAttribute("viewBox", `0 0 ${s.width} ${s.height}`);
      const B = Object.fromEntries(cards.map(c => [c.id, box(c)]));
      // spread the ends of the lines along each card's bottom and top edge
      const slotOut = {}, slotIn = {};
      Object.entries(out).forEach(([id, es]) => {
        es.slice().sort((p, q) => B[p.b].x - B[q.b].x).forEach((e, k) => { slotOut[e.a + ">" + e.b] = (k + 1) / (es.length + 1); });
      });
      Object.entries(inn).forEach(([id, es]) => {
        es.slice().sort((p, q) => B[p.a].x - B[q.a].x).forEach((e, k) => { slotIn[e.a + ">" + e.b] = (k + 1) / (es.length + 1); });
      });
      edges.forEach(e => {
        const A = B[e.a], C = B[e.b], key = e.a + ">" + e.b;
        const fa = 0.2 + 0.6 * slotOut[key], fb = 0.2 + 0.6 * slotIn[key];
        let d;
        if (C.y >= A.y + A.h - 1) {              // target below
          const x1 = A.x + A.w * fa, y1 = A.y + A.h, x2 = C.x + C.w * fb, y2 = C.y;
          const m = Math.max(28, (y2 - y1) / 2);
          d = `M${x1},${y1} C${x1},${y1 + m} ${x2},${y2 - m} ${x2},${y2}`;
        } else if (C.y + C.h <= A.y + 1) {       // target above (a back edge)
          const x1 = A.x + A.w * fa, y1 = A.y, x2 = C.x + C.w * fb, y2 = C.y + C.h;
          const m = Math.max(40, (y1 - y2) / 2);
          d = `M${x1},${y1} C${x1},${y1 - m} ${x2},${y2 + m} ${x2},${y2}`;
        } else {                                  // same row: side to side
          const right = C.x > A.x;
          const x1 = right ? A.x + A.w : A.x, x2 = right ? C.x : C.x + C.w;
          const y1 = A.y + A.h * fa, y2 = C.y + C.h * fb, m = (x2 - x1) / 2;
          d = `M${x1},${y1} C${x1 + m},${y1} ${x2 - m},${y2} ${x2},${y2}`;
        }
        e.el.setAttribute("d", d);
      });
    }

    // effect 2: lines draw themselves once the cards are in
    function drawIn() {
      if (still) { root.classList.add("drawn"); return; }
      const shown = edges.filter(e => e.core);
      shown.forEach((e, k) => {
        const L = e.el.getTotalLength();
        e.el.style.transition = "none";
        e.el.style.strokeDasharray = L;
        e.el.style.strokeDashoffset = L;
        e.el.getBoundingClientRect();
        e.el.style.transition = `stroke-dashoffset 900ms cubic-bezier(.4,0,.2,1) ${400 + k * 35}ms`;
        e.el.style.strokeDashoffset = 0;
      });
      setTimeout(() => {
        shown.forEach(e => { e.el.style.transition = e.el.style.strokeDasharray = e.el.style.strokeDashoffset = ""; });
        root.classList.add("drawn");
      }, 1400 + shown.length * 35);
    }

    let pending = false;
    const redraw = () => {
      if (pending) return;
      pending = true;
      requestAnimationFrame(() => { pending = false; draw(); });
    };
    new ResizeObserver(redraw).observe(stage);
    cards.forEach(c => new ResizeObserver(redraw).observe(c));
    draw();
    (document.fonts ? document.fonts.ready : Promise.resolve()).then(() => { draw(); drawIn(); });

    // effect 3: hover a card to trace needs (up) and leads-to (down)
    function focus(id) {
      root.classList.add("focus");
      const up = new Set((inn[id] || []).map(e => e.a)), down = new Set((out[id] || []).map(e => e.b));
      cards.forEach(c => {
        c.classList.toggle("on", c.id === id);
        c.classList.toggle("up", up.has(c.id));
        c.classList.toggle("down", down.has(c.id));
      });
      edges.forEach(e => {
        e.el.classList.toggle("up", e.b === id);
        e.el.classList.toggle("down", e.a === id);
      });
    }
    function unfocus() {
      root.classList.remove("focus");
      cards.forEach(c => c.classList.remove("on", "up", "down"));
      edges.forEach(e => e.el.classList.remove("up", "down"));
    }
    cards.forEach(c => {
      c.addEventListener("mouseenter", () => focus(c.id));
      c.addEventListener("mouseleave", unfocus);
      c.addEventListener("focusin", () => focus(c.id));
      c.addEventListener("focusout", ev => { if (!c.contains(ev.relatedTarget)) unfocus(); });
      // effect 8: a soft light that follows the pointer
      c.addEventListener("pointermove", ev => {
        const r = c.getBoundingClientRect();
        c.style.setProperty("--mx", `${ev.clientX - r.left}px`);
        c.style.setProperty("--my", `${ev.clientY - r.top}px`);
      });
    });

    // effect 7: branches open in place
    const branches = [...root.querySelectorAll(".tmap-branch")];
    const setOpen = (li, open) => {
      li.classList.toggle("open", open);
      li.querySelector("button").setAttribute("aria-expanded", open ? "true" : "false");
    };
    branches.forEach(li => li.querySelector("button").addEventListener("click", () => {
      li.dataset.auto = "";
      setOpen(li, !li.classList.contains("open"));
    }));

    // effects 5 and 6: search and field filter
    const search = root.querySelector(".tmap-search");
    let field = "";
    function filter() {
      const q = search.value.trim().toLowerCase();
      root.classList.toggle("searching", !!q);
      cards.forEach(c => {
        const fieldOk = !field || c.dataset.field === field;
        let hit = !q || c.querySelector("h3").textContent.toLowerCase().includes(q);
        c.querySelectorAll(".tmap-branch").forEach(li => {
          let bHit = false, nHit = false;
          if (q) {
            bHit = li.querySelector(".name").textContent.toLowerCase().includes(q);
            li.querySelectorAll(".tmap-notes li").forEach(n => {
              const m = n.textContent.toLowerCase().includes(q);
              n.classList.toggle("hit", m);
              nHit = nHit || m;
            });
          } else {
            li.querySelectorAll(".tmap-notes li.hit").forEach(n => n.classList.remove("hit"));
          }
          li.classList.toggle("hit", bHit || nHit);
          if (nHit && !li.classList.contains("open")) { setOpen(li, true); li.dataset.auto = "1"; }
          else if (!nHit && li.dataset.auto === "1") { setOpen(li, false); li.dataset.auto = ""; }
          hit = hit || bHit || nHit;
        });
        c.classList.toggle("off", !fieldOk || !hit);
      });
      edges.forEach(e => e.el.classList.toggle("off",
        byId[e.a].classList.contains("off") || byId[e.b].classList.contains("off")));
    }
    let timer = 0;
    search.addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(filter, 120); });
    search.addEventListener("keydown", ev => { if (ev.key === "Escape") { search.value = ""; filter(); } });
    root.querySelectorAll(".tmap-fields button").forEach(b => b.addEventListener("click", () => {
      field = b.dataset.field;
      root.querySelectorAll(".tmap-fields button").forEach(x => x.classList.toggle("active", x === b));
      filter();
    }));

    // effect 4: progress rings and bars
    function progress() {
      const P = window.StudyProgress;
      if (!P) return;
      cards.forEach(c => {
        let total = 0, done = 0;
        c.querySelectorAll(".tmap-branch").forEach(li => {
          const items = [...li.querySelectorAll(".tmap-notes a[data-item]")].map(a => a.dataset.item);
          const n = { learned: 0, reviewing: 0, mastered: 0 };
          items.forEach(i => { const s = P.stateOf(i); if (s in n) n[s]++; });
          const bar = li.querySelector(".tmap-bar");
          bar.innerHTML = ["mastered", "reviewing", "learned"].map(s =>
            `<span style="width:${items.length ? 100 * n[s] / items.length : 0}%;background:var(--pg-${s})"></span>`).join("");
          total += items.length;
          done += n.learned + n.reviewing + n.mastered;
        });
        const f = total ? done / total : 0;
        c.style.setProperty("--done", f.toFixed(4));
        c.querySelector(".tmap-pct").textContent = done ? `${Math.round(100 * f)}%` : "";
        c.classList.toggle("started", done > 0);
      });
    }
    document.addEventListener("study-progress-change", progress);
    progress();
  }

  function start() {
    traceGraphs();
    const root = document.getElementById("tmap");
    if (root) initMap(root);
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", start);
  else start();
})();
</script>
