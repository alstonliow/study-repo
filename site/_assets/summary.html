<!-- Filter bar for chapter summary pages (build/summaries.py, meta/SPEC.md §14)
     and for the exercises of a note page. Summary pages carry a .summary-filters
     placeholder; a note page with two or more exercises gets the bar above its
     exercises. Filters: content type (summaries only), source (the resource an
     exercise cites, when the page has several), written / code (when the page
     has both), level, progress state (from progress.html, via
     window.StudyProgress), and solutions (hidden / collapsed / expanded).
     Choices except source are kept per browser, separately for summaries and
     note pages. Printing the page prints what the filters show. -->
<style>
  .summary-filters { display: flex; flex-wrap: wrap; gap: 0.5rem 1.4rem; margin: 0.6rem 0 1.4rem; padding: 0.7rem 0.9rem;
    border: 1px solid var(--rule, #ddd); border-radius: 4px; font: 0.82rem/1.5 "Source Sans 3", system-ui, sans-serif; }
  .summary-filters fieldset { border: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.15rem 0.7rem; }
  .summary-filters legend { float: left; margin: 0 0.4rem 0 0; padding: 0; font-size: inherit; font-weight: 700;
    color: var(--notec, #777); text-transform: uppercase; letter-spacing: 0.06em; font-size: 0.7rem; }
  .summary-filters label { cursor: pointer; white-space: nowrap; }
  .summary-filters input { margin-right: 0.25rem; vertical-align: -1px; }
  .summary-filters .sf-count { margin-left: auto; color: var(--notec, #777); align-self: center; }
  .sf-hidden { display: none !important; }
  .summary-intro { display: block; color: var(--notec); font-size: 0.9rem; margin-bottom: 0.4rem; }
  .solutions-hidden .problem-group .callout { display: none !important; }
  @media print {
    #quarto-sidebar, #quarto-margin-sidebar, .navbar, #quarto-header, .summary-filters, nav.page-navigation,
    .page-footer, .pg-mark, .pg-note-row, .beyond-summary, .quarto-title-breadcrumbs, .course-banner,
    .callout-header .callout-btn-toggle { display: none !important; }
    #quarto-content { display: block !important; }
    main.content { max-width: none !important; margin: 0 !important; padding: 0 !important; }
    body { background: #fff !important; color: #000 !important; font-size: 11pt; }
    .summary-item, .problem-group { break-inside: avoid; }
    h2 { break-after: avoid; }
    .dep-graph-wrap { overflow: visible; }
    .dep-graph { max-width: 100%; }
    .solutions-expanded .callout .collapse { display: block !important; height: auto !important; }
    a { color: inherit !important; text-decoration: none !important; }
  }
</style>
<script>
(function () {
  // Two modes, one look. Summary pages carry a .summary-filters placeholder
  // (build/summaries.py). Note pages with two or more exercises get the same bar
  // above their exercises, with only the facets that page can use.
  const SOURCE = { key: "source", label: "Source", type: "check", options: [] };   // filled per page
  const YEAR = { key: "year", label: "Year", type: "check", options: [] };       // filled per page
  const TYPE = { key: "type", label: "Type", type: "check", options: [["written", "Written"], ["code", "Code"]] };
  const LEVEL = { key: "level", label: "Level", type: "check", options: [
    ["easy", "Easy"], ["medium", "Medium"], ["hard", "Hard"], ["", "Unrated"]] };
  const STATE = { key: "state", label: "Progress", type: "check", options: [
    ["new", "New"], ["learned", "Learned"], ["reviewing", "Reviewing"], ["mastered", "Mastered"]] };
  const SOLUTIONS = { key: "solutions", label: "Solutions", type: "radio", options: [
    ["hidden", "Hidden"], ["collapsed", "Collapsed"], ["expanded", "Expanded"]] };
  const KIND = { key: "kind", label: "Show", type: "check", options: [
    ["def", "Definitions"], ["result", "Results"], ["exercise", "Exercises"], ["synthesis", "Synthesis"]] };
  const PER_PAGE = ["source", "year"];   // facets whose values differ per page (lists of values switched off)
  const DEFAULT = { kind: ["def", "result", "exercise", "synthesis"], type: ["written", "code"],
                    level: ["easy", "medium", "hard", ""], state: ["new", "learned", "reviewing", "mastered"],
                    solutions: "collapsed" };

  // `source` and `year` are the values switched off on this page; they are not
  // kept, as each page has its own sources and years.
  function load(key) {
    let s;
    try { s = Object.assign({}, DEFAULT, JSON.parse(localStorage.getItem(key) || "{}")); }
    catch (e) { s = Object.assign({}, DEFAULT); }
    s.source = [];
    s.year = [];
    return s;
  }
  function save(key, s) {
    const { source, year, ...kept } = s;
    try { localStorage.setItem(key, JSON.stringify(kept)); } catch (e) { /* private mode */ }
  }

  function stateOf(item) {
    return window.StudyProgress ? window.StudyProgress.stateOf(item) : "new";
  }

  function groupOk(el, s) {
    return s.level.includes(el.dataset.level || "") && s.state.includes(stateOf(el.dataset.item)) &&
           s.type.includes(el.dataset.kind === "code" ? "code" : "written") &&
           !s.source.includes(el.dataset.source || "") && !s.year.includes(el.dataset.year || "");
  }

  function apply(box, s, summary) {
    const main = document.querySelector("main") || document.body;
    let shown = 0, total = 0;
    if (summary) main.querySelectorAll(".summary-item").forEach(el => {
      const ok = s.kind.includes(el.dataset.kind) && s.state.includes(stateOf(el.dataset.item));
      el.classList.toggle("sf-hidden", !ok);
      total++; if (ok) shown++;
    });
    main.querySelectorAll(".problem-group").forEach(el => {
      const kind = el.classList.contains("synthesis") ? "synthesis" : "exercise";
      const ok = (!summary || s.kind.includes(kind)) && groupOk(el, s);
      el.classList.toggle("sf-hidden", !ok);
      total++; if (ok) shown++;
    });
    // headings with nothing visible under them
    if (summary) main.querySelectorAll("h3").forEach(h => {
      let n = h.nextElementSibling, any = false;
      const VISIBLE = ".summary-item:not(.sf-hidden), .problem-group:not(.sf-hidden)";
      while (n && !/^H[23]$/.test(n.tagName)) {
        if (n.matches(VISIBLE) || n.querySelector(VISIBLE)) any = true;
        n = n.nextElementSibling;
      }
      h.classList.toggle("sf-hidden", !any);
    });
    document.body.classList.toggle("solutions-hidden", s.solutions === "hidden");
    document.body.classList.toggle("solutions-expanded", s.solutions === "expanded");
    main.querySelectorAll(".problem-group .callout").forEach(c => {
      const body = c.querySelector(".callout-collapse, .collapse");
      if (!body) return;
      const open = s.solutions === "expanded";
      body.classList.toggle("show", open);
      const head = c.querySelector(".callout-header");
      if (head) head.setAttribute("aria-expanded", open ? "true" : "false");
      c.classList.toggle("callout-titled-expanded", open);
    });
    const count = box.querySelector(".sf-count");
    if (count) count.textContent = `${shown} of ${total} shown`;
  }

  // the facets this page can use: a facet with one value on the page is left out
  function groupsFor(summary) {
    const probs = [...document.querySelectorAll("main .problem-group")];
    const sources = new Map();
    probs.forEach(g => sources.set(g.dataset.source || "", g.dataset.sourceLabel || "Other"));
    // years, newest first; problems without one go last as "Undated" (SPEC §17.15.7)
    const years = [...new Set(probs.map(g => g.dataset.year || ""))]
      .sort((a, b) => (a === "") - (b === "") || b.localeCompare(a));
    const kinds = new Set(probs.map(g => g.dataset.kind === "code" ? "code" : "written"));
    const out = summary ? [KIND] : [];
    if (sources.size > 1)
      out.push(Object.assign({}, SOURCE, { options: [...sources].sort((a, b) => a[1].localeCompare(b[1])) }));
    if (years.length > 1)
      out.push(Object.assign({}, YEAR, { options: years.map(y => [y, y || "Undated"]) }));
    if (kinds.size > 1) out.push(TYPE);
    if (summary || probs.some(g => g.dataset.level)) out.push(LEVEL);
    out.push(STATE, SOLUTIONS);
    return out;
  }

  function build(box, key, summary) {
    let s = load(key);
    groupsFor(summary).forEach(g => {
      const fs = document.createElement("fieldset");
      const lg = document.createElement("legend");
      lg.textContent = g.label;
      fs.appendChild(lg);
      g.options.forEach(([value, text]) => {
        const label = document.createElement("label");
        const input = document.createElement("input");
        input.type = g.type === "radio" ? "radio" : "checkbox";
        input.name = "sf-" + g.key;
        input.value = value;
        input.checked = g.type === "radio" ? s[g.key] === value
                      : PER_PAGE.includes(g.key) ? !s[g.key].includes(value) : s[g.key].includes(value);
        input.addEventListener("change", () => {
          if (g.type === "radio") s[g.key] = value;
          else if (PER_PAGE.includes(g.key))
            s[g.key] = Array.from(fs.querySelectorAll("input:not(:checked)")).map(i => i.value);
          else s[g.key] = Array.from(fs.querySelectorAll("input:checked")).map(i => i.value);
          save(key, s);
          apply(box, s, summary);
        });
        label.append(input, text);
        fs.appendChild(label);
      });
      box.appendChild(fs);
    });
    const count = document.createElement("span");
    count.className = "sf-count";
    box.appendChild(count);
    const reset = document.createElement("button");
    reset.type = "button";
    reset.textContent = "Reset";
    reset.className = "btn btn-sm btn-link p-0";
    reset.addEventListener("click", () => {
      s = Object.assign({}, DEFAULT, { source: [], year: [] }); save(key, s); box.innerHTML = ""; build(box, key, summary);
    });
    box.appendChild(reset);
    box.hidden = false;
    apply(box, s, summary);
    if (!box.dataset.listening) {
      box.dataset.listening = "1";
      document.addEventListener("study-progress-change", () => apply(box, s, summary));
    }
  }

  document.addEventListener("DOMContentLoaded", () => {
    const box = document.querySelector(".summary-filters");
    if (box) { build(box, "study-summary-filters", true); return; }
    const probs = document.querySelectorAll("main .problem-group");
    if (probs.length < 2) return;
    const bar = document.createElement("div");
    bar.className = "summary-filters exercise-filters";
    bar.setAttribute("role", "group");
    bar.setAttribute("aria-label", "Filter exercises");
    probs[0].before(bar);
    build(bar, "study-exercise-filters", false);
  });
})();
</script>
