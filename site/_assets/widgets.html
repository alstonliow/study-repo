<!-- Interactive step-through widgets (website only; meta/SPEC.md §5, "Interactive widgets").
     Each widget is attached to an existing captioned figure by its id and appears
     right below the figure's caption. It replays an algorithm frame by frame on the
     figure's example, and most accept the reader's own input. The PDF keeps only the
     static figure. Widgets are registered in WIDGETS at the end of this file; pages
     without a matching figure are not touched. Colours follow the theme variables
     of styles.css, so light and dark themes both work. -->
<style>
  .wg { border: 1px solid var(--rule); border-radius: 6px; margin: 0.4rem 0 1.6rem; padding: 0.7rem 0.9rem 0.8rem;
        font: 0.88rem/1.45 "Source Sans 3", system-ui, sans-serif; }
  .wg-head { display: flex; flex-wrap: wrap; align-items: center; gap: 0.4rem 0.8rem; margin-bottom: 0.5rem; }
  .wg-title { font-weight: 700; color: var(--defc); margin-right: auto; }
  .wg-title::before { content: "▶ "; font-size: 0.75em; vertical-align: 1px; }
  .wg-inputs { display: flex; flex-wrap: wrap; gap: 0.3rem 0.8rem; align-items: center; margin-bottom: 0.5rem; }
  .wg-inputs label { white-space: nowrap; color: var(--notec); }
  .wg-inputs input[type=text] { font: inherit; padding: 0.05rem 0.35rem; border: 1px solid var(--rule); border-radius: 3px;
        background: transparent; color: inherit; width: 14rem; }
  .wg-inputs input.short { width: 4rem; }
  .wg-inputs select { font: inherit; border: 1px solid var(--rule); border-radius: 3px; background: transparent; color: inherit; }
  .wg button { font: inherit; border: 1px solid var(--rule); border-radius: 3px; background: transparent; color: inherit;
        padding: 0.05rem 0.55rem; cursor: pointer; }
  .wg button:hover { border-color: var(--defc); color: var(--defc); }
  .wg-controls { display: flex; flex-wrap: wrap; gap: 0.3rem; align-items: center; margin-top: 0.55rem; }
  .wg-controls input[type=range] { flex: 1 1 8rem; min-width: 6rem; }
  .wg-count { color: var(--notec); font-variant-numeric: tabular-nums; min-width: 4.5rem; text-align: right; }
  .wg-stage { min-height: 3rem; overflow-x: auto; }
  .wg-note { margin-top: 0.45rem; min-height: 2.6em; }
  .wg-sub { margin-top: 0.2rem; color: var(--notec); font-variant-numeric: tabular-nums; }
  .wg-error { color: var(--thmc); }
  .wg-row { display: flex; align-items: flex-end; gap: 3px; margin: 0.25rem 0; }
  .wg-rowlab { color: var(--notec); font-size: 0.8em; min-width: 5.5rem; text-align: right; margin-right: 0.4rem; align-self: center; }
  .wg-cell { min-width: 2.1rem; height: 2.1rem; display: inline-flex; flex-direction: column; justify-content: center; align-items: center;
        border: 1px solid var(--rule); border-radius: 3px; background: color-mix(in srgb, var(--notec) 8%, transparent);
        font-variant-numeric: tabular-nums; position: relative; padding: 0 0.15rem; }
  .wg-cell small { position: absolute; bottom: -1.15rem; font-size: 0.7em; color: var(--notec); }
  .wg-row.idx { margin-bottom: 1.2rem; }
  .wg-cell.hl { border-color: var(--thmc); background: color-mix(in srgb, var(--thmc) 28%, transparent); }
  .wg-cell.cmp { border-color: var(--thmc); border-style: dashed; }
  .wg-cell.done { border-color: var(--defc); background: color-mix(in srgb, var(--defc) 22%, transparent); }
  .wg-cell.dim { opacity: 0.35; }
  .wg-cell.empty { background: transparent; border-style: dotted; }
  .wg-gap { width: 0.9rem; }
  .wg table.wg-table { border-collapse: collapse; font-variant-numeric: tabular-nums; margin: 0.2rem 0; }
  .wg-table td, .wg-table th { border: 1px solid var(--rule); padding: 0.1rem 0.45rem; text-align: center; min-width: 1.6rem; }
  .wg-table th { color: var(--notec); font-weight: 600; }
  .wg-table td.hl { background: color-mix(in srgb, var(--thmc) 28%, transparent); }
  .wg-table td.done { background: color-mix(in srgb, var(--defc) 18%, transparent); }
  .wg-table td.dim { color: var(--notec); }
  .wg svg { display: block; overflow: visible; }
  .wg svg .n circle { fill: color-mix(in srgb, var(--defc) 10%, var(--bs-body-bg, #fff)); stroke: currentColor; stroke-width: 1.2; }
  .wg svg .n.hl circle { fill: color-mix(in srgb, var(--thmc) 35%, var(--bs-body-bg, #fff)); stroke: var(--thmc); stroke-width: 2; }
  .wg svg .n.done circle { fill: color-mix(in srgb, var(--defc) 32%, var(--bs-body-bg, #fff)); stroke: var(--defc); }
  .wg svg .n.dim { opacity: 0.4; }
  .wg svg text { fill: currentColor; font: 14px "Source Sans 3", system-ui, sans-serif; text-anchor: middle; dominant-baseline: central; }
  .wg svg text.small { font-size: 11px; fill: var(--notec); }
  .wg svg text.wlab { font-size: 11.5px; paint-order: stroke; stroke: var(--bs-body-bg, #fff); stroke-width: 4px; }
  .wg svg line, .wg svg path.e { stroke: currentColor; stroke-width: 1.1; fill: none; opacity: 0.55; }
  .wg svg .e.hl { stroke: var(--thmc); stroke-width: 2.6; opacity: 1; }
  .wg svg .e.done { stroke: var(--defc); stroke-width: 2.2; opacity: 0.9; }
  .wg svg .e.dim { opacity: 0.18; }
  .wg svg marker path { fill: currentColor; }
  .wg svg rect.wg-bar { fill: color-mix(in srgb, var(--notec) 12%, var(--bs-body-bg, #fff)); stroke: currentColor; stroke-width: 1; }
  .wg svg rect.wg-bar.hl { fill: color-mix(in srgb, var(--thmc) 35%, var(--bs-body-bg, #fff)); stroke: var(--thmc); }
  .wg svg rect.wg-bar.done { fill: color-mix(in srgb, var(--defc) 32%, var(--bs-body-bg, #fff)); stroke: var(--defc); }
  .wg svg rect.wg-bar.dim { opacity: 0.3; }
  .wg svg line { opacity: 0.55; }
  @media print { .wg { display: none; } }
</style>
<script>
(function () {
  "use strict";
  // ---------- small helpers ----------
  const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");
  const INF = Infinity, fmt = x => x === INF ? "∞" : x === -INF ? "−∞" : String(x).replace("-", "−");
  const nums = s => s.split(/[\s,]+/).filter(Boolean).map(t => { const v = Number(t); if (!Number.isInteger(v)) throw new Error("“" + t + "” is not an integer"); return v; });
  let uid = 0;

  function row(vals, cls = {}, opts = {}) {
    let h = `<div class="wg-row${opts.idx ? " idx" : ""}">`;
    if (opts.label !== undefined) h += `<span class="wg-rowlab">${opts.label}</span>`;
    vals.forEach((v, i) => {
      if (opts.gaps && opts.gaps.has(i)) h += `<span class="wg-gap"></span>`;
      const c = typeof cls === "function" ? cls(i) : (cls[i] || "");
      h += `<span class="wg-cell ${v === null || v === undefined ? "empty" : ""} ${c}">${v === null || v === undefined ? "" : esc(fmt(v))}${opts.idx ? `<small>${i}</small>` : ""}</span>`;
    });
    return h + "</div>";
  }
  function table(header, rows, cls = () => "", rowHead = null) {
    let h = `<table class="wg-table"><tr>${rowHead ? "<th></th>" : ""}${header.map(x => `<th>${esc(x)}</th>`).join("")}</tr>`;
    rows.forEach((r, i) => {
      h += "<tr>" + (rowHead ? `<th>${esc(rowHead[i])}</th>` : "") + r.map((v, j) => `<td class="${cls(i, j)}">${esc(fmt(v))}</td>`).join("") + "</tr>";
    });
    return h + "</table>";
  }
  // graph: pos {v:[x,y]} (pixels), edges [[u,v,w]], directed, classes for nodes/edges, labels under nodes
  function graph(pos, edges, o = {}) {
    const R = 16, id = "wgm" + (++uid), xs = Object.values(pos).map(p => p[0]), ys = Object.values(pos).map(p => p[1]);
    const W = Math.max(...xs) + 40, H = Math.max(...ys) + 44;
    let s = `<svg width="${W}" height="${H}" viewBox="-20 -24 ${W + 20} ${H + 24}">`;
    if (o.directed) s += `<defs><marker id="${id}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z"/></marker></defs>`;
    const ec = o.edgeCls || (() => ""), nc = o.nodeCls || (() => ""), under = o.under || (() => "");
    edges.forEach(([a, b, w]) => {
      const [x1, y1] = pos[a], [x2, y2] = pos[b], dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy);
      const two = o.directed && edges.some(e => e[0] === b && e[1] === a), off = two ? 7 : 0;
      const nx = -dy / L * off, ny = dx / L * off;
      const sx = x1 + dx / L * R + nx, sy = y1 + dy / L * R + ny, tx = x2 - dx / L * (R + 2) + nx, ty = y2 - dy / L * (R + 2) + ny;
      s += `<path class="e ${ec(a, b)}" d="M${sx},${sy} L${tx},${ty}" ${o.directed ? `marker-end="url(#${id})"` : ""}/>`;
      if (w !== undefined && w !== null) s += `<text class="wlab" x="${(sx + tx) / 2 + nx * 1.4}" y="${(sy + ty) / 2 + ny * 1.4}">${fmt(w)}</text>`;
    });
    for (const [v, [x, y]] of Object.entries(pos)) {
      s += `<g class="n ${nc(v)}"><circle cx="${x}" cy="${y}" r="${R}"/><text x="${x}" y="${y}">${esc(v)}</text></g>`;
      const u = under(v); if (u !== "") s += `<text class="small" x="${x}" y="${y + R + 11}">${esc(u)}</text>`;
    }
    return s + "</svg>";
  }
  // binary tree from nodes {id:{key,left,right}}: in-order layout
  function tree(nodes, root, o = {}) {
    if (root === null || root === undefined) return `<div class="wg-note">(empty tree)</div>`;
    const pos = {}; let k = 0, depth = 0;
    (function walk(v, d) { if (v === null || v === undefined) return; walk(nodes[v].left, d + 1); pos[v] = [k++ * 38, d * 52]; depth = Math.max(depth, d); walk(nodes[v].right, d + 1); })(root, 0);
    const edges = []; for (const v in pos) for (const c of [nodes[v].left, nodes[v].right]) if (c !== null && c !== undefined) edges.push([v, c]);
    const P = {}, lab = {}; for (const v in pos) { P[v] = pos[v]; }
    const keyOf = v => nodes[v].key;
    const svg = graph(P, edges, { nodeCls: o.nodeCls, edgeCls: o.edgeCls, under: o.under });
    return svg.replace(/<text x="([\d.-]+)" y="([\d.-]+)">([^<]*)<\/text>/g, (m, x, y, v) => `<text x="${x}" y="${y}">${esc(keyOf(v))}</text>`);
  }

  // ---------- the widget frame ----------
  function mount(anchor, spec) {
    const box = document.createElement("div"); box.className = "wg";
    const inputs = (spec.inputs || []).map(inp => inp.options
      ? `<label>${inp.label} <select data-k="${inp.name}">${inp.options.map(o => `<option value="${o[0]}"${o[0] === inp.value ? " selected" : ""}>${o[1]}</option>`).join("")}</select></label>`
      : `<label>${inp.label} <input type="text" class="${inp.short ? "short" : ""}" data-k="${inp.name}" value="${esc(inp.value)}"></label>`).join("");
    box.innerHTML = `<div class="wg-head"><span class="wg-title">${spec.title}</span></div>` +
      (inputs ? `<div class="wg-inputs">${inputs}<button data-a="run">Run</button><button data-a="example">Example</button></div>` : "") +
      `<div class="wg-stage"></div><div class="wg-note"></div>
       <div class="wg-controls"><button data-a="first" title="first step">⏮</button><button data-a="prev" title="previous step">◀</button>
       <button data-a="play" title="play / pause">▶</button><button data-a="next" title="next step">▶|</button><button data-a="last" title="last step">⏭</button>
       <input type="range" min="0" value="0"><span class="wg-count"></span></div>`;
    anchor.after(box);
    const stage = box.querySelector(".wg-stage"), note = box.querySelector(".wg-note"), range = box.querySelector("input[type=range]"),
          count = box.querySelector(".wg-count"), playBtn = box.querySelector("[data-a=play]");
    let frames = [], i = 0, timer = null;
    const show = () => { const f = frames[i]; stage.innerHTML = f.html; note.innerHTML = f.note || ""; range.value = i; count.textContent = `${i + 1} / ${frames.length}`; };
    const stop = () => { clearInterval(timer); timer = null; playBtn.textContent = "▶"; };
    const params = () => { const p = {}; box.querySelectorAll("[data-k]").forEach(el => p[el.dataset.k] = el.value); return p; };
    const run = () => {
      stop();
      try { frames = spec.run(params()); if (!frames.length) throw new Error("nothing to show"); }
      catch (e) { frames = [{ html: "", note: `<span class="wg-error">${esc(e.message)}</span>` }]; }
      i = 0; range.max = frames.length - 1; show();
    };
    box.addEventListener("click", ev => {
      const a = ev.target.dataset && ev.target.dataset.a; if (!a) return;
      if (a === "run") return run();
      if (a === "example") { box.querySelectorAll("[data-k]").forEach(el => { const d = spec.inputs.find(x => x.name === el.dataset.k); el.value = d.value; }); return run(); }
      if (a === "play") {
        if (timer) return stop();
        if (i >= frames.length - 1) i = 0;
        playBtn.textContent = "❚❚"; timer = setInterval(() => { if (i >= frames.length - 1) return stop(); i++; show(); }, spec.speed || 900); return;
      }
      stop();
      if (a === "first") i = 0; if (a === "last") i = frames.length - 1;
      if (a === "prev") i = Math.max(0, i - 1); if (a === "next") i = Math.min(frames.length - 1, i + 1);
      show();
    });
    range.addEventListener("input", () => { stop(); i = Number(range.value); show(); });
    box.querySelectorAll("input[type=text]").forEach(el => el.addEventListener("keydown", e => { if (e.key === "Enter") run(); }));
    run();
  }

  // ---------- algorithms (each returns a list of frames {html, note}) ----------
  const limit = (a, n, what) => { if (a.length > n) throw new Error(`at most ${n} ${what}, please`); return a; };

  // ---------- templates: a new widget supplies data and step notes only ----------
  // Marks: hl (current, terracotta), done (finished, blue), dim (out of play).
  const markOf = (s, k) => (s.hl || []).includes(k) ? "hl" : (s.done || []).includes(k) ? "done" : (s.dim || []).includes(k) ? "dim" : "";

  // arrayFrames([{ a: [3, 1, 2], hl: [0], done: [2], dim: [], gaps: [1], note: "..." }, ...])
  // One row of cells per step; `gaps` puts a divider before those indices.
  function arrayFrames(steps, opts = {}) {
    return steps.map(s => ({ html: row(s.a, i => markOf(s, i), { idx: opts.idx !== false, gaps: new Set(s.gaps || []) }), note: s.note || "" }));
  }

  // dpFrames({ rows: n, cols: m, rowHead: [...], colHead: [...],
  //            base: (i, j) => value or undefined,         // filled before the first step
  //            order: [[i, j], ...],                       // cells in evaluation order
  //            step: (i, j, x) => ({ v, deps: [[i, j]], note }),   // x = table so far
  //            show: v => text, every: k,                  // optional: format, record every k-th cell
  //            final: x => ({ path: [[i, j]], note }) })    // optional trace-back frame
  function dpFrames(d) {
    const x = Array.from({ length: d.rows }, (_, i) => Array.from({ length: d.cols }, (_, j) => { const b = d.base ? d.base(i, j) : undefined; return b === undefined ? null : b; }));
    const show = d.show || (v => v), F = [], key = (i, j) => i + "," + j;
    const pic = (cls, note) => F.push({ html: table(d.colHead || [...Array(d.cols).keys()].map(String), x.map(r => r.map(v => v === null ? "" : show(v))), cls, d.rowHead || [...Array(d.rows).keys()].map(String)), note });
    pic((i, j) => x[i][j] !== null ? "done" : "", d.baseNote || "Base cases.");
    d.order.forEach(([i, j], k) => {
      const r = d.step(i, j, x); x[i][j] = r.v;
      const deps = new Set((r.deps || []).map(([a, b]) => key(a, b)));
      if (!d.every || k % d.every === 0 || k === d.order.length - 1)
        pic((a, b) => a === i && b === j ? "hl" : deps.has(key(a, b)) ? "done" : "", r.note || "");
    });
    if (d.final) { const f = d.final(x), on = new Set((f.path || []).map(([a, b]) => key(a, b))); pic((a, b) => on.has(key(a, b)) ? "hl" : "", f.note || ""); }
    return F;
  }
  // rows from bottom to top, each left to right (and the other three orders)
  const cellsOrder = (rows, cols, rowsDown = false, colsRight = true, skip = () => false) => {
    const out = [], R = [...Array(rows).keys()], C = [...Array(cols).keys()];
    for (const i of rowsDown ? R : R.reverse()) for (const j of colsRight ? C : [...C].reverse()) if (!skip(i, j)) out.push([i, j]);
    return out;
  };

  // graphFrames({ pos: place({...}), edges: [["a","b",w]], directed },
  //             [{ hl: ["a"], done: ["b"], dim: [], edges: { "a-b": "hl" }, under: { a: "d=0" }, note }, ...])
  // Edge marks are keyed "u-v" (either direction for undirected graphs) and persist only within a step.
  function graphFrames(G, steps) {
    return steps.map(s => ({
      html: graph(G.pos, G.edges, { directed: G.directed,
        nodeCls: v => markOf(s, v),
        edgeCls: (a, b) => (s.edges || {})[a + "-" + b] || (!G.directed && (s.edges || {})[b + "-" + a]) || "",
        under: v => (s.under || {})[v] ?? "" }),
      note: s.note || "" }));
  }

  function binarySearch(p) {
    const A = limit(nums(p.array), 16, "items").slice().sort((x, y) => x - y), t = Number(p.target), F = [];
    let lo = 0, hi = A.length;
    F.push({ html: row(A, {}, { idx: true }), note: `Search for ${fmt(t)} in the sorted array (the input is sorted first).` });
    while (lo < hi) {
      const m = (lo + hi) >> 1;
      F.push({ html: row(A, i => i === m ? "hl" : (i < lo || i >= hi ? "dim" : ""), { idx: true }), note: `Range [${lo}, ${hi - 1}]: compare ${fmt(t)} with the middle item A[${m}] = ${fmt(A[m])}.` });
      if (A[m] === t) { F.push({ html: row(A, i => i === m ? "done" : "dim", { idx: true }), note: `Found at index ${m} after ${F.length - 1} comparisons.` }); return F; }
      if (t < A[m]) hi = m; else lo = m + 1;
    }
    F.push({ html: row(A, () => "dim", { idx: true }), note: `The range is empty: ${fmt(t)} is absent (${F.length - 1} comparisons, at most ⌊log₂ n⌋ + 1).` });
    return F;
  }

  function sorting(p) {
    const A = limit(nums(p.array), 14, "items").slice(), n = A.length, F = [], alg = p.alg;
    const snap = (cls, note, gaps) => F.push({ html: row(A.slice(), cls, { idx: true, gaps }), note });
    snap({}, "Start.");
    if (alg === "selection") {
      for (let i = n - 1; i > 0; i--) {
        let j = 0; for (let k = 1; k <= i; k++) if (A[k] > A[j]) j = k;
        snap(k => k === j || k === i ? "hl" : k > i ? "done" : "", `A largest item of A[0..${i}] is ${fmt(A[j])} at index ${j}; swap it into position ${i}.`);
        [A[i], A[j]] = [A[j], A[i]];
        snap(k => k >= i ? "done" : "", `Positions ${i}..${n - 1} are now sorted and final.`);
      }
    } else if (alg === "insertion") {
      for (let i = 1; i < n; i++) {
        let j = i;
        snap(k => k === j ? "hl" : k < i ? "done" : "", `Insert ${fmt(A[i])} into the sorted prefix A[0..${i - 1}].`);
        while (j > 0 && A[j] < A[j - 1]) { [A[j], A[j - 1]] = [A[j - 1], A[j]]; j--; snap(k => k === j ? "hl" : k <= i ? "done" : "", `${fmt(A[j])} is smaller than its left neighbour: swap.`); }
      }
    } else {
      (function ms(a, b) {
        if (b - a < 2) return;
        const c = Math.ceil((a + b) / 2);
        ms(a, c); ms(c, b);
        const L = A.slice(a, c), R = A.slice(c, b); let i = 0, j = 0;
        snap(k => k >= a && k < b ? "cmp" : "", `Merge the sorted halves A[${a}..${c - 1}] = ${L.map(fmt).join(", ")} and A[${c}..${b - 1}] = ${R.map(fmt).join(", ")}.`);
        for (let k = a; k < b; k++) A[k] = (j >= R.length || (i < L.length && L[i] <= R[j])) ? L[i++] : R[j++];
        snap(k => k >= a && k < b ? "done" : "", `A[${a}..${b - 1}] is sorted.`);
      })(0, n);
    }
    snap(() => "done", "Sorted.");
    return F;
  }

  function radix(p) {
    const A = limit(nums(p.array), 12, "items"), base = Number(p.base) || 10, F = [];
    if (A.some(x => x < 0)) throw new Error("keys must be non-negative");
    const u = Math.max(...A) + 1; let c = 1; while (base ** c < u) c++;
    const digits = x => { let s = ""; for (let k = 0; k < c; k++) { s = (Math.floor(x / base ** k) % base).toString(base > 10 ? 36 : 10) + s; } return s; };
    let cur = A.slice();
    F.push({ html: row(cur.map(digits), {}, { label: "keys" }) + row(cur, {}, { label: "values" }), note: `Write each key with ${c} digit(s) in base ${base}.` });
    for (let k = 0; k < c; k++) {
      const d = x => Math.floor(x / base ** k) % base, buckets = Array.from({ length: base }, () => []);
      cur.forEach(x => buckets[d(x)].push(x));
      let h = "";
      buckets.forEach((b, j) => { if (b.length) h += row(b.map(digits), {}, { label: `digit ${j}` }); });
      F.push({ html: h, note: `Pass ${k + 1}: counting sort by digit ${k + 1} from the right. Items go into the chain of their digit, in their current order.` });
      cur = buckets.flat();
      F.push({ html: row(cur.map(digits), {}, { label: "keys" }) + row(cur, {}, { label: "values" }), note: `Read the chains in order. Stability keeps ties in the order of the previous pass.` });
    }
    F.push({ html: row(cur, () => "done", { label: "sorted" }), note: "Sorted after one stable pass per digit." });
    return F;
  }

  function hashing(p) {
    const K = limit(nums(p.keys), 16, "keys"), m = Number(p.m) || 7, F = [], T = Array.from({ length: m }, () => []);
    if (m < 1 || m > 13) throw new Error("table size between 1 and 13, please");
    const draw = (hk, note) => {
      let h = ""; T.forEach((ch, j) => h += row(ch.length ? ch : [null], k => j === hk && k === ch.length - 1 ? "hl" : "", { label: `slot ${j}` }));
      F.push({ html: h, note });
    };

  function dynArray(p) {

  // binary heap (max)

  // ---------- graphs (fixed examples, the same as in the static figures) ----------

  function bfs() {

  function dfs() {

  function elimination(p) {

    const ys = xs.map(p => p[1]).concat(opts.ys || [], [0]);
    let y0 = Math.min(...ys), y1 = Math.max(...ys); if (y1 - y0 < 1e-9) y1 = y0 + 1;
    const X = x => pad + (x - lo) / (hi - lo) * (W - 2 * pad), Y = y => H - pad - (y - y0) / (y1 - y0) * (H - 2 * pad);
    const path = xs.map((p, i) => (i ? "L" : "M") + X(p[0]).toFixed(1) + " " + Y(p[1]).toFixed(1)).join(" ");
    const body = shapes({ X, Y });
    return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}"><line x1="${pad}" y1="${Y(0)}" x2="${W - pad}" y2="${Y(0)}" stroke="currentColor" stroke-opacity=".4"/>${body}<path d="${path}" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>`;
  }

  function riemann(p) {
    const c = CALC_F[p.f], a = Number(p.a), b = Number(p.b), N = Number(p.n), rule = p.rule;
    if (!c) throw new Error("choose a function");
    if (!Number.isFinite(a) || !Number.isFinite(b) || !(a < b)) throw new Error("numbers a < b, please");
    if (c.min !== undefined && a < c.min) throw new Error(c.min === 0 ? `${c.tex} needs a ≥ 0` : `${c.tex} needs a > 0`);
    if (b - a > 20) throw new Error("an interval of length at most 20, please");
    if (!Number.isInteger(N) || N < 1 || N > 64) throw new Error("n from 1 to 64, please");
    const exact = c.F(b) - c.F(a), F = [];
    for (let n = 1; ; n = Math.min(2 * n, N)) {
      const h = (b - a) / n; let s = 0; const pieces = [];
      for (let i = 0; i < n; i++) {
        const l = a + i * h, r = l + h;
        const yl = c.f(l), yr = c.f(r), ym = c.f(l + h / 2);
        const y = rule === "left" ? yl : rule === "right" ? yr : ym;
        if (rule === "trap") { s += (yl + yr) / 2 * h; pieces.push([l, r, yl, yr]); } else { s += y * h; pieces.push([l, r, y, y]); }
      }
      const svg = plotSVG(c.f, a, b, ({ X, Y }) => pieces.map(([l, r, u, v]) =>
        `<polygon points="${X(l)},${Y(0)} ${X(l)},${Y(u)} ${X(r)},${Y(v)} ${X(r)},${Y(0)}" fill="var(--defc)" fill-opacity=".25" stroke="var(--defc)" stroke-width=".8"/>`).join(""),
        { ys: pieces.flatMap(q => [q[2], q[3]]) });
      F.push({ html: svg, note: `n = ${n}: sum = ${cfmt(s)}; exact integral = ${cfmt(exact)}; error = ${cfmt(s - exact, 8)}.` });
      if (n === N) break;
    }
    return F;
  }

  // ---------- multivariable calculus (MIT 18.02) ----------
  const DBL_F = {
    para: { f: (x, y) => 1 - x * x - y * y, I: 1 / 3, tex: "1 − x² − y²" },
    xy: { f: (x, y) => x * y, I: 1 / 4, tex: "xy" },
    sum: { f: (x, y) => x + y, I: 1, tex: "x + y" },
    exp: { f: (x, y) => Math.exp(-x * y), I: 0.7965995992970531, tex: "e^(−xy)" },
  };
  function doubleRiemann(p) {
    const c = DBL_F[p.f], N = Number(p.n);
    if (!c) throw new Error("choose a function");
    if (!Number.isInteger(N) || N < 1 || N > 32) throw new Error("n from 1 to 32, please");
    const F = [], S = 240, pad = 20;
    for (let n = 1; ; n = Math.min(2 * n, N)) {
      const h = 1 / n, vals = [];
      for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) vals.push([i, j, c.f((i + .5) * h, (j + .5) * h)]);
      const vmax = Math.max(...vals.map(v => Math.abs(v[2])), 1e-9), s = vals.reduce((a, v) => a + v[2], 0) * h * h;
      const cells = vals.map(([i, j, v]) => `<rect x="${pad + i * S * h}" y="${pad + (n - 1 - j) * S * h}" width="${S * h}" height="${S * h}" fill="${v >= 0 ? "var(--defc)" : "var(--thmc)"}" fill-opacity="${(0.08 + 0.7 * Math.abs(v) / vmax).toFixed(2)}" stroke="currentColor" stroke-opacity=".25" stroke-width=".6"/>`).join("");
      const svg = `<svg width="${S + 2 * pad}" height="${S + 2 * pad}" viewBox="0 0 ${S + 2 * pad} ${S + 2 * pad}">${cells}<text x="${pad}" y="${S + 2 * pad - 4}" font-size="11" fill="currentColor">0</text><text x="${S + pad - 6}" y="${S + 2 * pad - 4}" font-size="11" fill="currentColor">1</text></svg>`;
      F.push({ html: svg, note: `n = ${n}: ${n * n} squares of area ${cfmt(h * h)}, f at the midpoints (darker = larger |f|); sum = ${cfmt(s)}; exact ∬ ${c.tex} dA over the unit square = ${cfmt(c.I)}; error = ${cfmt(s - c.I, 8)}.` });
      if (n === N) break;
    }
    return F;
  }
  const WORK_F = {
    rot: { F: (x, y) => [-y, x], W: a => 2 * Math.PI * a * a, tex: "−y i + x j" },
    rad: { F: (x, y) => [x, y], W: a => 0, tex: "x i + y j" },
    grad: { F: (x, y) => [y, x], W: a => 0, tex: "y i + x j = ∇(xy)" },
    vortex: { F: (x, y) => { const r2 = x * x + y * y; return [-y / r2, x / r2]; }, W: a => 2 * Math.PI, tex: "(−y i + x j)/r²" },
  };
  function circleWork(p) {
    const c = WORK_F[p.F], a = Number(p.a), N = Number(p.n);
    if (!c) throw new Error("choose a field");
    if (!Number.isFinite(a) || !(a > 0) || a > 5) throw new Error("a radius between 0 and 5, please");
    if (!Number.isInteger(N) || N < 3 || N > 128) throw new Error("n from 3 to 128, please");
    const F = [], S = 260, M = S / 2, k = (M - 24) / a;
    for (let n = 4; ; n = Math.min(2 * n, N)) {
      let w = 0, segs = "";
      for (let i = 0; i < n; i++) {
        const t0 = 2 * Math.PI * i / n, t1 = 2 * Math.PI * (i + 1) / n;
        const x0 = a * Math.cos(t0), y0 = a * Math.sin(t0), x1 = a * Math.cos(t1), y1 = a * Math.sin(t1);
        const [u, v] = c.F((x0 + x1) / 2, (y0 + y1) / 2); w += u * (x1 - x0) + v * (y1 - y0);
        const mx = (x0 + x1) / 2, my = (y0 + y1) / 2, len = Math.hypot(u, v) || 1, sc = 0.45 * a / Math.max(len, 1e-9);
        segs += `<line x1="${M + k * x0}" y1="${M - k * y0}" x2="${M + k * x1}" y2="${M - k * y1}" stroke="currentColor" stroke-width="1.4"/>`;
        if (n <= 32) segs += `<line x1="${M + k * mx}" y1="${M - k * my}" x2="${M + k * (mx + sc * u)}" y2="${M - k * (my + sc * v)}" stroke="var(--thmc)" stroke-width="2.2"/><circle cx="${M + k * (mx + sc * u)}" cy="${M - k * (my + sc * v)}" r="1.8" fill="var(--thmc)"/>`;
      }
      const svg = `<svg width="${S}" height="${S}" viewBox="0 0 ${S} ${S}"><line x1="0" y1="${M}" x2="${S}" y2="${M}" stroke="currentColor" stroke-opacity=".25"/><line x1="${M}" y1="0" x2="${M}" y2="${S}" stroke="currentColor" stroke-opacity=".25"/>${segs}</svg>`;
      F.push({ html: svg, note: `${n} chords, counterclockwise: Σ F·Δr = ${cfmt(w)} (F at each chord's midpoint, drawn in colour); exact ∮ F·dr = ${cfmt(c.W(a))} for F = ${c.tex}.` });
      if (n === N) break;
    }
    return F;
  }

  const NEWTON_F = {
    sq3: { f: x => x * x - 3, d: x => 2 * x, tex: "x² − 3" },
    cube9: { f: x => x ** 3 - 9, d: x => 3 * x * x, tex: "x³ − 9" },
    cos: { f: x => Math.cos(x) - x, d: x => -Math.sin(x) - 1, tex: "cos x − x" },
    cbrt: { f: x => Math.cbrt(x), d: x => 1 / (3 * Math.cbrt(x) ** 2), tex: "x^(1/3)" },
  };
  function newton(p) {
    const c = NEWTON_F[p.f], x0 = Number(p.x0), K = Number(p.steps);
    if (!c) throw new Error("choose a function");
    if (!Number.isFinite(x0) || Math.abs(x0) > 50) throw new Error("a starting point between −50 and 50, please");
    if (!Number.isInteger(K) || K < 1 || K > 10) throw new Error("1 to 10 steps, please");
    const xs = [x0], F = [];
    for (let k = 0; k < K; k++) {
      const x = xs[k], d = c.d(x);
      if (!Number.isFinite(d) || Math.abs(d) < 1e-12) { F.push({ html: "", note: `Step ${k + 1}: f′(x${k}) = 0, the tangent is flat; the method stops.` }); break; }
      xs.push(x - c.f(x) / d);
      const all = xs.slice(), lo = Math.min(...all), hi = Math.max(...all), m = (hi - lo) * 0.25 + 0.5;
      const svg = plotSVG(c.f, lo - m, hi + m, ({ X, Y }) => all.slice(0, -1).map((u, i) =>
        `<line x1="${X(u)}" y1="${Y(0)}" x2="${X(u)}" y2="${Y(c.f(u))}" stroke="currentColor" stroke-dasharray="3 3" stroke-opacity=".5"/>` +
        `<line x1="${X(u)}" y1="${Y(c.f(u))}" x2="${X(all[i + 1])}" y2="${Y(0)}" stroke="var(--thmc)" stroke-width="${i === k ? 2 : 1}"/>`).join("") +
        `<circle cx="${X(all[k + 1])}" cy="${Y(0)}" r="3.5" fill="var(--thmc)"/>`);
      F.push({ html: svg, note: `x${k + 1} = x${k} − f(x${k})/f′(x${k}) = ${cfmt(xs[k + 1], 10)};  f(x${k + 1}) = ${cfmt(c.f(xs[k + 1]), 10)}.` });
      if (!Number.isFinite(xs[k + 1]) || Math.abs(xs[k + 1]) > 1e6) break;
    }
    return F;
  }

  // ---------- registry: figure id -> widget ----------
  const WIDGETS = {
    "fig-definite-integral-1": { title: "Try it: Riemann sums and the trapezoidal rule", inputs: [{ name: "f", label: "f(x)", value: "sq", options: [["sq", "x²"], ["sqrt", "√x"], ["sin", "sin x"], ["exp", "eˣ"], ["inv", "1/x"]] }, { name: "a", label: "a", value: "0", short: true }, { name: "b", label: "b", value: "2", short: true }, { name: "n", label: "up to n", value: "32", short: true }, { name: "rule", label: "rule", value: "left", options: [["left", "left endpoints"], ["right", "right endpoints"], ["mid", "midpoints"], ["trap", "trapezoids"]] }], run: riemann, speed: 1300 },
    "fig-double-integrals-1": { title: "Try it: double Riemann sums", inputs: [{ name: "f", label: "f(x, y)", value: "para", options: [["para", "1 − x² − y²"], ["xy", "xy"], ["sum", "x + y"], ["exp", "e^(−xy)"]] }, { name: "n", label: "up to n", value: "16", short: true }], run: doubleRiemann, speed: 1300 },
    "fig-vector-fields-and-line-integrals-1": { title: "Try it: work around a circle", inputs: [{ name: "F", label: "field F", value: "rot", options: [["rot", "−y i + x j"], ["rad", "x i + y j"], ["grad", "y i + x j"], ["vortex", "(−y i + x j)/r²"]] }, { name: "a", label: "radius a", value: "1", short: true }, { name: "n", label: "up to n", value: "64", short: true }], run: circleWork, speed: 1300 },
    "fig-newtons-method-1": { title: "Try it: Newton's method", inputs: [{ name: "f", label: "f(x)", value: "sq3", options: [["sq3", "x² − 3"], ["cube9", "x³ − 9"], ["cos", "cos x − x"], ["cbrt", "x^(1/3) (fails)"]] }, { name: "x0", label: "x₀", value: "3", short: true }, { name: "steps", label: "steps", value: "5", short: true }], run: newton, speed: 1300 },
    "fig-elimination-1": { title: "Try it: elimination on [A b]", inputs: [{ name: "m", label: "rows (; between)", value: "1 1 1 6; 2 3 5 23; 4 0 5 19" }], run: elimination, speed: 1300 },
    "fig-orthonormal-bases-and-gram-schmidt-1": { title: "Try it: Gram–Schmidt", inputs: [{ name: "v", label: "vectors (; between)", value: "1 1 0; 1 0 1; 0 1 1" }], run: gramSchmidt, speed: 1400 },
    "fig-comparison-sorting-1": { title: "Try it: binary search", inputs: [{ name: "array", label: "array", value: "1 3 4 6 8 9 11 14 17" }, { name: "target", label: "find", value: "11", short: true }], run: binarySearch },
    "fig-comparison-sorting-2": { title: "Try it: selection, insertion and merge sort", inputs: [{ name: "array", label: "array", value: "7 3 5 1 4" }, { name: "alg", label: "algorithm", value: "insertion", options: [["selection", "selection sort"], ["insertion", "insertion sort"], ["merge", "merge sort"]] }], run: sorting },
    "fig-comparison-sorting-3": { title: "Try it: merge sort", inputs: [{ name: "array", label: "array", value: "6 2 7 1 5 3 8 4" }, { name: "alg", label: "algorithm", value: "merge", options: [["merge", "merge sort"], ["insertion", "insertion sort"], ["selection", "selection sort"]] }], run: sorting },
    "fig-linear-sorting-2": { title: "Try it: radix sort", inputs: [{ name: "array", label: "keys", value: "17 3 24 22 12" }, { name: "base", label: "base", value: "5", short: true }], run: radix, speed: 1300 },
    "fig-hashing-1": { title: "Try it: hashing with chaining", inputs: [{ name: "keys", label: "keys", value: "12 7 19 4 26 15" }, { name: "m", label: "size m", value: "5", short: true }], run: hashing },
    "fig-linked-lists-and-dynamic-arrays-2": { title: "Try it: appending to a dynamic array", inputs: [{ name: "n", label: "appends", value: "9", short: true }], run: dynArray, speed: 700 },
    "fig-binary-trees-2": { title: "Try it: inserting into a binary search tree", inputs: [{ name: "keys", label: "insert", value: "8 4 13 2 6 10 15 7 11" }], run: p => bst(p, false) },
    "fig-avl-trees-2": { title: "Try it: AVL insertions with rotations", inputs: [{ name: "keys", label: "insert", value: "1 2 3 4 5 6 7 10 9 8" }], run: p => bst(p, true), speed: 1200 },
    "fig-binary-heaps-2": { title: "Try it: heap insert and delete_max", inputs: [{ name: "array", label: "insert", value: "9 7 8 3 5 6 2 1 0 10" }], run: p => heap(p, "insert") },
    "fig-binary-heaps-3": { title: "Try it: building a heap in O(n)", inputs: [{ name: "array", label: "array", value: "2 9 4 7 1 8 6 3" }], run: p => heap(p, "build") },
    "fig-breadth-first-search-1": { title: "Step through: breadth-first search", run: bfs },
    "fig-depth-first-search-1": { title: "Step through: depth-first search and finishing order", run: dfs },
    "fig-weighted-shortest-paths-1": { title: "Step through: DAG relaxation", run: dagRelax, speed: 1100 },
    "fig-bellman-ford-1": { title: "Step through: Bellman–Ford, one edge count at a time", run: bellmanFord, speed: 1300 },
    "fig-dijkstra-1": { title: "Step through: Dijkstra's algorithm", run: dijkstra, speed: 1100 },
    "fig-recursive-algorithms-2": { title: "Try it: bowling by dynamic programming", inputs: [{ name: "values", label: "pin values", value: "3 -2 4 4 -1 2" }], run: bowling, speed: 1300 },
    "fig-subproblem-design-1": { title: "Try it: longest common subsequence", inputs: [{ name: "a", label: "A", value: "SNOWY", short: true }, { name: "b", label: "B", value: "SUNNY", short: true }], run: lcs },
    "fig-greedy-algorithms-1": { title: "Try it: earliest-finish-time-first", inputs: [{ name: "list", label: "requests s-f", value: "0-6, 1-4, 3-5, 3-8, 4-7, 5-9, 6-10, 8-11" }], run: intervals },
    "fig-union-find-1": { title: "Try it: union by rank and path compression", inputs: [{ name: "ops", label: "operations", value: "make a b c d e f; union a b; union c d; union a c; union e f; union e a; find d" }], run: unionFind, speed: 1300 },
    "fig-two-three-trees-1": { title: "Try it: inserting into a 2-3 tree", inputs: [{ name: "keys", label: "insert", value: "10 20 5 15 25 30 35 40 12 18" }], run: twoThree, speed: 1200 },
    "fig-randomized-algorithms-1": { title: "Try it: randomized quicksort", inputs: [{ name: "array", label: "array", value: "6 2 9 4 7 1 8 3 5" }, { name: "seed", label: "seed", value: "7", short: true }], run: quicksortRandom, speed: 1200 },
    "fig-minimum-spanning-trees-1": { title: "Step through: Kruskal and Prim", inputs: [{ name: "alg", label: "algorithm", value: "kruskal", options: [["kruskal", "Kruskal"], ["prim", "Prim"]] }], run: mst, speed: 1100 },
    "fig-maximum-flow-1": { title: "Step through: Edmonds–Karp", run: edmondsKarp, speed: 1300 },
    "fig-interval-subproblems-1": { title: "Try it: optimal binary search tree", inputs: [{ name: "w", label: "weights", value: "10 8 9" }], run: optimalBST, speed: 1300 },
    "fig-amortized-analysis-1": { title: "Try it: binary counter and its potential", inputs: [{ name: "n", label: "increments", value: "16", short: true }], run: counter, speed: 700 },
    "fig-approximation-algorithms-1": { title: "Step through: 2-approximation for vertex cover", run: vertexCover, speed: 1200 },
    "fig-pseudopolynomial-time-1": { title: "Try it: subset sum table", inputs: [{ name: "array", label: "numbers", value: "2 5 9 14" }, { name: "target", label: "target", value: "16", short: true }], run: subsetSum, speed: 1300 },
  };

  function init() {
    for (const [fid, spec] of Object.entries(WIDGETS)) {
      const el = document.getElementById(fid); if (!el) continue;
      const anchor = el.closest("p, figure, div.quarto-figure") || el;
      try { mount(anchor, spec); } catch (e) { console.error("widget", fid, e); }
    }
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init); else init();
})();
</script>
