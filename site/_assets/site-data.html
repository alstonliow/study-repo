<!-- Shared by the page scripts (filter.html, progress.html): the site root,
     a path helper, and one fetch of site-data.json (generated by
     build/make_site.py). Included first, before the scripts that use it. -->
<script>
window.StudySite = (function () {
  const offsetMeta = document.querySelector('meta[name="quarto:offset"]');
  const root = new URL(offsetMeta ? offsetMeta.content : "./", window.location.href);
  // site-relative path of a link, e.g. "notes/math/discrete/sets/subsets.html"
  function sitePath(href) {
    const u = new URL(href, window.location.href);
    let p = u.pathname.startsWith(root.pathname) ? u.pathname.slice(root.pathname.length) : u.pathname;
    if (p === "" || p.endsWith("/")) p += "index.html";
    return p;
  }
  const data = fetch(new URL("site-data.json", root))
    .then(r => (r.ok ? r.json() : null))
    .catch(() => null);
  return { root, sitePath, data };
})();
</script>
