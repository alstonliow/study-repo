<!-- Course filter: a collapsed panel at the bottom of the sidebar. With nothing ticked,
     everything is shown in topic order. With courses ticked, the sidebar lists
     only those courses' knowledge points in course order (by chapter), the
     previous/next links follow that order, and blocks and exercises outside
     the selected courses' scope are folded into a one-line "Beyond ..."
     summary (meta/SPEC.md §13). The choice is kept per browser (localStorage).
     Data: site-data.json, loaded by site-data.html. -->
<style>
  .course-filter { margin: 1.2rem 0 0.6rem; font-size: 0.8rem; color: #7A7A7A; }
  .course-filter summary { cursor: pointer; list-style: none; }
  .course-filter summary::-webkit-details-marker { display: none; }
  .course-filter summary::after { content: " \25B8"; }
  .course-filter[open] summary::after { content: " \25BE"; }
  .course-filter .course-filter-body { padding: 0.3rem 0 0 0.2rem; }
  .course-filter label { display: block; cursor: pointer; margin: 0.1rem 0; }
  .course-filter input { margin-right: 0.35rem; }
  .course-filter-note { color: #7A7A7A; margin-top: 0.25rem; }
  .course-hidden { display: none !important; }
  .scope-folded:not(.scope-open) { display: none !important; }
  /* a folded block: one line in the block's own colour, like a closed theorem box */
  .beyond-summary { --k: var(--notec, #767676);
    display: flex; align-items: baseline; gap: 0.7em; width: 100%; margin: 0.55em 0; padding: 0.45em 0.8em 0.45em 0.9em;
    text-align: left; font: 0.9rem/1.4 "Source Sans 3", system-ui, sans-serif; color: var(--bs-body-color);
    background: color-mix(in srgb, var(--k) 9%, transparent); border: none; border-left: 3px solid var(--k);
    border-radius: 0 3px 3px 0; cursor: pointer; }
  .beyond-summary:hover { background: color-mix(in srgb, var(--k) 15%, transparent); }
  .beyond-summary[data-kind="def"] { --k: var(--defc, #3b6ea5); }
  .beyond-summary[data-kind="thm"], .beyond-summary[data-kind="prp"], .beyond-summary[data-kind="lem"],
  .beyond-summary[data-kind="cor"] { --k: var(--thmc, #a5533b); }
  .beyond-summary[data-kind="exm"] { --k: var(--exc, #4e8a5a); }
  .beyond-summary[data-kind="prob"] { --k: var(--probfg, #3d4046); }
  .beyond-kind { --k: var(--notec, #767676); font-weight: 700; color: var(--k); }
  .beyond-kind[data-kind="def"] { --k: var(--defc, #3b6ea5); }
  .beyond-kind[data-kind="thm"], .beyond-kind[data-kind="prp"], .beyond-kind[data-kind="lem"],
  .beyond-kind[data-kind="cor"] { --k: var(--thmc, #a5533b); }
  .beyond-kind[data-kind="exm"] { --k: var(--exc, #4e8a5a); }
  .beyond-name { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .beyond-tag { flex: none; font-weight: 700; font-size: 0.7rem; letter-spacing: 0.07em; text-transform: uppercase;
    color: var(--thmc, #a5533b); }
  .beyond-tag::after { content: "  \25B8"; }
  .beyond-summary.open .beyond-tag::after { content: "  \25BE"; }
  .beyond-summary.open { margin-bottom: 0.2em; }
  .scope-open { outline: 1px dashed color-mix(in srgb, var(--thmc, #a5533b) 45%, transparent); outline-offset: 4px; }
</style>
<script>
(function () {
  const KEY = "study-course-filter";
  const { root, sitePath } = window.StudySite;

  function load() {
    try { return JSON.parse(localStorage.getItem(KEY) || "[]"); } catch (e) { return []; }
  }
  function save(sel) {
    try { localStorage.setItem(KEY, JSON.stringify(sel)); } catch (e) { /* private mode */ }
  }
  function overlaps(list, sel) { return (list || []).some(c => sel.includes(c)); }

  // Original Quarto sidebar tree (topic order) and the course-order tree built from it.
  let topicTree = null, courseTree = null, navOriginal = null;

  function leafMap() {
    const m = {};
    topicTree.querySelectorAll("li.sidebar-item:not(.sidebar-item-section)").forEach(li => {
      const a = li.querySelector("a.sidebar-link");
      if (a) m[sitePath(a.getAttribute("href"))] = li;
    });
    return m;
  }

  function section(title, href, depth) {
    const li = document.createElement("li");
    li.className = "sidebar-item sidebar-item-section course-order-section";
    const head = document.createElement("div");
    head.className = "sidebar-item-container";
    const t = document.createElement(href ? "a" : "span");
    t.className = "sidebar-item-text sidebar-link";
    if (href) t.href = new URL(href, root).href;
    const span = document.createElement("span");
    span.className = "menu-text";
    span.textContent = title;
    t.appendChild(span);
    head.appendChild(t);
    const ul = document.createElement("ul");
    ul.className = "list-unstyled sidebar-section depth" + depth;
    li.appendChild(head);
    li.appendChild(ul);
    return [li, ul];
  }

  // Course numbering: chapter.k, by position inside the chapter (e.g. 2.8).
  // Notes keep their own topic number on the page itself; only the sidebar and
  // previous/next links use the course number while a filter is active.
  const TOPIC_NUM = /^\s*\d+(\.\d+)*\s+/;
  function courseNumbers(data, cid) {
    const m = {};
    (data.order[cid] || []).forEach(ch => ch.pages.forEach((p, k) => {
      m[p] = ch.num ? ch.num + "." + (k + 1) : "";
    }));
    return m;
  }
  function plainTitle(li) {
    return li.querySelector(".menu-text").textContent.replace(TOPIC_NUM, "").trim();
  }
  function renumber(li, num) {
    // change only the text node, so a progress dot inside .menu-text survives
    const text = li.querySelector(".menu-text");
    const node = Array.from(text.childNodes).reverse().find(n => n.nodeType === 3 && n.textContent.trim());
    const title = text.textContent.replace(TOPIC_NUM, "").trim();
    if (node) node.textContent = (num ? num + " " : "") + title;
  }

  // Sidebar in course order: one block per selected course, grouped by chapter.
  function buildCourseTree(data, sel) {
    const leaves = leafMap();
    const tree = document.createElement("ul");
    tree.className = "list-unstyled mt-1 course-order-tree";
    data.courses.filter(c => sel.includes(c.id)).forEach(c => {
      const [cli, cul] = section(c.code + " (course order)", "courses/" + c.id + ".html", 1);
      const nums = courseNumbers(data, c.id);
      (data.order[c.id] || []).forEach(ch => {
        const [hli, hul] = section(ch.title, null, 2);
        ch.pages.forEach(p => {
          if (!leaves[p]) return;
          const li = leaves[p].cloneNode(true);
          li.classList.remove("course-hidden");
          renumber(li, nums[p]);
          hul.appendChild(li);
        });
        if (hul.children.length) cul.appendChild(hli);
      });
      tree.appendChild(cli);
    });
    return tree;
  }

  function navLink(path, title, dir) {
    const div = document.createElement("div");
    div.className = "nav-page nav-page-" + dir;
    if (!path) return div;
    const a = document.createElement("a");
    a.className = "pagination-link";
    a.href = new URL(path, root).href;
    a.setAttribute("aria-label", title);
    const icon = '<i class="bi bi-arrow-' + (dir === "previous" ? "left" : "right") + '-short"></i>';
    const text = document.createElement("span");
    text.className = "nav-page-text";
    text.textContent = title;
    a.innerHTML = dir === "previous" ? icon + " " : "";
    a.appendChild(text);
    if (dir === "next") a.insertAdjacentHTML("beforeend", " " + icon);
    div.appendChild(a);
    return div;
  }

  // Previous/next links at the bottom follow the course order of the first
  // selected course that contains this page.
  function applyNav(data, sel) {
    const nav = document.querySelector("nav.page-navigation");
    if (!nav) return;
    if (navOriginal === null) navOriginal = nav.innerHTML;
    nav.innerHTML = navOriginal;
    if (!sel.length) return;
    const here = sitePath(window.location.href);
    const leaves = leafMap();
    for (const c of data.courses) {
      if (!sel.includes(c.id)) continue;
      const nums = courseNumbers(data, c.id);
      const title = p => ((nums[p] ? nums[p] + " " : "") + (leaves[p] ? plainTitle(leaves[p]) : p));
      const flat = (data.order[c.id] || []).flatMap(ch => ch.pages).filter(p => leaves[p]);
      const i = flat.indexOf(here);
      if (i < 0) continue;
      nav.innerHTML = "";
      nav.appendChild(navLink(flat[i - 1], flat[i - 1] && title(flat[i - 1]), "previous"));
      nav.appendChild(navLink(flat[i + 1], flat[i + 1] && title(flat[i + 1]), "next"));
      return;
    }
  }

  // The course tree is built after Quarto has scrolled the (now hidden) topic
  // tree, so bring the current page's entry into view ourselves.
  function scrollToActive(tree) {
    const a = tree.querySelector("a.sidebar-link.active");
    const box = document.getElementById("quarto-sidebar");
    if (!a || !box) return;
    const r = a.getBoundingClientRect(), b = box.getBoundingClientRect();
    // leave it alone when already comfortably visible; otherwise put it a third of the way down
    if (r.top < b.top || r.bottom > b.bottom - box.clientHeight / 4) {
      box.scrollTop += r.top - b.top - box.clientHeight / 3;
    }
  }

  // Numbers on the page itself (title, headings, table of contents, links to
  // other notes, breadcrumbs, tab title) follow the course too. Original
  // texts are remembered so unticking restores them.
  const origText = new Map(), origHref = new Map();
  let origDocTitle = null;
  function setText(node, t) { if (!origText.has(node)) origText.set(node, node.textContent); node.textContent = t; }
  function setHref(a, h) { if (!origHref.has(a)) origHref.set(a, a.getAttribute("href")); a.setAttribute("href", h); }
  function restorePage() {
    origText.forEach((t, n) => { n.textContent = t; }); origText.clear();
    origHref.forEach((h, a) => a.setAttribute("href", h)); origHref.clear();
    if (origDocTitle !== null) document.title = origDocTitle;
  }
  function swapNum(t, from, to) {
    const m = t.match(/^(\s*)(\d+(?:\.\d+)*)/);
    if (!m || !(m[2] === from || m[2].startsWith(from + "."))) return null;
    return m[1] + to + m[2].slice(from.length) + t.slice(m[0].length);
  }
  function renumIn(el, from, to) {
    const w = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
    for (let n = w.nextNode(); n; n = w.nextNode()) {
      if (!n.textContent.trim()) continue;
      const t = swapNum(n.textContent, from, to);
      if (t !== null) setText(n, t);
      return;  // only the first non-empty text carries the number
    }
  }
  function topicNum(li) {
    const m = li && li.querySelector(".menu-text").textContent.trim().match(/^\d+(\.\d+)*/);
    return m ? m[0] : null;
  }

  function applyPage(data, sel) {
    restorePage();
    if (!sel.length) return;
    const here = sitePath(window.location.href);
    const leaves = leafMap();
    const c = data.courses.find(c => sel.includes(c.id) && courseNumbers(data, c.id)[here]);
    if (!c) return;
    const nums = courseNumbers(data, c.id);
    const from = topicNum(leaves[here]), to = nums[here];
    if (!from) return;
    // this page: title, section headings, table of contents, tab title
    document.querySelectorAll("h1.title, main h2, main h3, main h4, #TOC a").forEach(el => renumIn(el, from, to));
    if (origDocTitle === null) origDocTitle = document.title;
    document.title = swapNum(document.title, from, to) || document.title;
    // links to notes (prerequisites, cross-references, breadcrumb leaf)
    document.querySelectorAll("main a[href], .quarto-page-breadcrumbs a[href]").forEach(a => {
      if (a.closest("nav.page-navigation")) return;
      const p = sitePath(a.getAttribute("href"));
      if (nums[p] && topicNum(leaves[p])) renumIn(a, topicNum(leaves[p]), nums[p]);
    });
    // breadcrumb topic -> course chapter
    const chapter = (data.order[c.id] || []).find(ch => ch.pages.includes(here));
    document.querySelectorAll(".quarto-page-breadcrumbs a[href]").forEach(a => {
      if (chapter && /\/index\.html$/.test(sitePath(a.getAttribute("href"))) && a.closest("li") !== a.closest("ol").firstElementChild) {
        setText(a, chapter.title);
        setHref(a, new URL("courses/" + c.id + ".html", root).href);
      }
    });
  }

  // Blocks and exercises outside the selected courses' scope fold into a
  // one-line summary that opens on click. Only on pages that are in scope of a
  // selected course; a page wholly outside gets the banner instead.
  function applyScope(data, sel) {
    document.querySelectorAll(".beyond-summary").forEach(b => b.remove());
    document.querySelectorAll(".scope-folded").forEach(el => el.classList.remove("scope-folded", "scope-open"));
    const here = data.pages[sitePath(window.location.href)] || [];
    const active = sel.filter(c => here.includes(c));
    if (!active.length) return;
    const codes = active.map(id => (data.courses.find(c => c.id === id) || { code: id }).code).join(", ");
    // group neighbouring out-of-scope blocks: one summary line per group
    const groups = [];
    let prev = null;
    document.querySelectorAll(".scope-block[data-courses], .problem-group[data-courses]").forEach(el => {
      const cs = el.getAttribute("data-courses").split(/\s+/).filter(Boolean);
      if (overlaps(cs, sel)) { prev = null; return; }
      if (prev && prev.nextElementSibling === el) groups[groups.length - 1].push(el);
      else groups.push([el]);
      prev = el;
    });
    groups.forEach(group => {
      const items = group.map(el => {
        const t = el.querySelector(".problem-title");
        const label = el.getAttribute("data-label") || (t ? t.textContent : "");
        const cut = label.indexOf(": ");
        return { kind: el.getAttribute("data-kind") || (t ? "prob" : ""),
                 word: cut < 0 ? label : label.slice(0, cut), name: cut < 0 ? "" : label.slice(cut + 2) };
      });
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "beyond-summary";
      const kinds = new Set(items.map(x => x.kind));
      btn.dataset.kind = kinds.size === 1 ? items[0].kind : "";
      const list = document.createElement("span");
      list.className = "beyond-name";
      items.forEach((x, k) => {
        if (k) list.appendChild(document.createTextNode("  ·  "));
        const w = document.createElement("span");
        w.className = "beyond-kind";
        w.dataset.kind = x.kind;
        w.textContent = x.word;
        list.appendChild(w);
        if (x.name) list.appendChild(document.createTextNode(" " + x.name));
      });
      btn.title = items.map(x => x.word + (x.name ? " " + x.name : "")).join(" · ");
      const tag = document.createElement("span");
      tag.className = "beyond-tag";
      tag.textContent = "Beyond " + codes + (group.length > 1 ? " · " + group.length : "");
      btn.append(list, tag);
      btn.addEventListener("click", () => {
        const open = !btn.classList.contains("open");
        btn.classList.toggle("open", open);
        group.forEach(el => el.classList.toggle("scope-open", open));
      });
      group[0].before(btn);
      group.forEach(el => el.classList.add("scope-folded"));
    });
  }

  function apply(data, sel) {
    const active = sel.length > 0;
    // sidebar: topic order when no filter, course order when filtered
    if (courseTree) { courseTree.remove(); courseTree = null; }
    if (topicTree) {
      topicTree.classList.toggle("course-hidden", active);
      if (active) {
        courseTree = buildCourseTree(data, sel);
        topicTree.after(courseTree);
      }
      const tree = courseTree || topicTree;
      {
        scrollToActive(tree);
        // run again once the page has finished loading: fonts, maths and
        // Quarto's own sidebar scroll can still move things after this point
        if (document.readyState !== "complete") {
          window.addEventListener("load", () => requestAnimationFrame(() => scrollToActive(tree)), { once: true });
        }
      }
    }
    applyNav(data, sel);
    applyPage(data, sel);
    applyScope(data, sel);
    // banner when the current page is outside the selection
    const here = data.pages[sitePath(window.location.href)];
    let banner = document.querySelector(".course-banner");
    const outside = active && here !== undefined && !overlaps(here, sel);
    if (outside && !banner) {
      banner = document.createElement("div");
      banner.className = "course-banner";
      banner.textContent = "This page is not part of the selected course(s).";
      const main = document.querySelector("main") || document.body;
      main.insertBefore(banner, main.firstChild);
    } else if (!outside && banner) {
      banner.remove();
    }
  }

  function render(data) {
    const sidebar = document.querySelector("#quarto-sidebar .sidebar-menu-container") || document.querySelector("#quarto-sidebar");
    if (!sidebar || !data.courses.length) return;
    topicTree = sidebar.querySelector(":scope > ul");
    data.order = data.order || {};
    let sel = load().filter(id => data.courses.some(c => c.id === id));
    const box = document.createElement("details");
    box.className = "course-filter";
    box.open = sel.length > 0;  // stays open while a filter is active
    box.innerHTML = '<summary>Filter by course</summary>';
    const body = document.createElement("div");
    body.className = "course-filter-body";
    box.appendChild(body);
    data.courses.forEach(c => {
      const label = document.createElement("label");
      const cb = document.createElement("input");
      cb.type = "checkbox";
      cb.value = c.id;
      cb.checked = sel.includes(c.id);
      cb.addEventListener("change", () => {
        sel = Array.from(box.querySelectorAll("input:checked")).map(i => i.value);
        save(sel);
        apply(data, sel);
      });
      label.appendChild(cb);
      label.appendChild(document.createTextNode(c.code));
      if (c.name) label.title = c.name;
      body.appendChild(label);
    });
    const note = document.createElement("div");
    note.className = "course-filter-note";
    note.textContent = "Nothing ticked = show everything.";
    body.appendChild(note);
    sidebar.appendChild(box);
    apply(data, sel);
  }

  document.addEventListener("DOMContentLoaded", () => {
    window.StudySite.data.then(data => { if (data) render(data); });  // filter is optional
  });
})();
</script>
