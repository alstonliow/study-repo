<!-- Course filter: a collapsed panel at the bottom of the sidebar. With nothing ticked,
     everything is shown. With courses ticked, sidebar entries and exercises
     that belong to none of them are hidden. The choice is kept per browser
     (localStorage). Data: courses.json, generated by build/make_site.py. -->
<style>
  .course-filter { margin: 1.2rem 0 0.6rem; font-size: 0.8rem; color: #7A7A7A; }
  .course-filter summary { cursor: pointer; list-style: none; }
  .course-filter summary::-webkit-details-marker { display: none; }
  .course-filter summary::after { content: " \25B8"; }
  .course-filter[open] summary::after { content: " \25BE"; }
  .course-filter .course-filter-body { padding: 0.3rem 0 0 0.2rem; }
  .course-filter label { display: block; cursor: pointer; margin: 0.1rem 0; }
  .course-filter input { margin-right: 0.35rem; }
  .course-filter-note { color: #7A7A7A; margin-top: 0.25rem; }
  .course-hidden { display: none !important; }
  .course-banner { border-left: 3px solid #A5533B; background: rgba(165, 83, 59, 0.07); padding: 0.4rem 0.7rem; margin: 0 0 1rem; font-size: 0.9rem; }
</style>
<script>
(function () {
  const KEY = "study-course-filter";
  const offsetMeta = document.querySelector('meta[name="quarto:offset"]');
  const root = new URL(offsetMeta ? offsetMeta.content : "./", window.location.href);

  function load() {
    try { return JSON.parse(localStorage.getItem(KEY) || "[]"); } catch (e) { return []; }
  }
  function save(sel) {
    try { localStorage.setItem(KEY, JSON.stringify(sel)); } catch (e) { /* private mode */ }
  }
  function sitePath(href) {
    const u = new URL(href, window.location.href);
    let p = u.pathname.startsWith(root.pathname) ? u.pathname.slice(root.pathname.length) : u.pathname;
    if (p === "" || p.endsWith("/")) p += "index.html";
    return p;
  }
  function overlaps(list, sel) { return (list || []).some(c => sel.includes(c)); }

  function apply(data, sel) {
    const active = sel.length > 0;
    // sidebar leaves
    document.querySelectorAll("#quarto-sidebar .sidebar-item").forEach(li => {
      if (li.querySelector(".sidebar-item-section, ul")) return; // sections handled below
      const a = li.querySelector("a.sidebar-link");
      if (!a) return;
      const courses = data.pages[sitePath(a.getAttribute("href"))];
      li.classList.toggle("course-hidden", active && courses !== undefined && !overlaps(courses, sel));
      if (active && courses === undefined && sitePath(a.getAttribute("href")).startsWith("notes/")) {
        li.classList.add("course-hidden");
      }
    });
    // sections: hide when every leaf inside is hidden
    Array.from(document.querySelectorAll("#quarto-sidebar li.sidebar-item-section")).reverse().forEach(sec => {
      const leaves = sec.querySelectorAll("ul li.sidebar-item:not(.sidebar-item-section)");
      const visible = Array.from(leaves).some(li => !li.classList.contains("course-hidden"));
      sec.classList.toggle("course-hidden", active && leaves.length > 0 && !visible);
    });
    // exercises on the page
    document.querySelectorAll("[data-courses]").forEach(el => {
      const courses = el.getAttribute("data-courses").split(/\s+/).filter(Boolean);
      el.classList.toggle("course-hidden", active && !overlaps(courses, sel));
    });
    // banner when the current page is outside the selection
    const here = data.pages[sitePath(window.location.href)];
    let banner = document.querySelector(".course-banner");
    const outside = active && here !== undefined && !overlaps(here, sel);
    if (outside && !banner) {
      banner = document.createElement("div");
      banner.className = "course-banner";
      banner.textContent = "This page is not part of the selected course(s).";
      const main = document.querySelector("main") || document.body;
      main.insertBefore(banner, main.firstChild);
    } else if (!outside && banner) {
      banner.remove();
    }
  }

  function render(data) {
    const sidebar = document.querySelector("#quarto-sidebar .sidebar-menu-container") || document.querySelector("#quarto-sidebar");
    if (!sidebar || !data.courses.length) return;
    let sel = load().filter(id => data.courses.some(c => c.id === id));
    const box = document.createElement("details");
    box.className = "course-filter";
    box.open = sel.length > 0;  // stays open while a filter is active
    box.innerHTML = '<summary>Filter by course</summary>';
    const body = document.createElement("div");
    body.className = "course-filter-body";
    box.appendChild(body);
    data.courses.forEach(c => {
      const label = document.createElement("label");
      const cb = document.createElement("input");
      cb.type = "checkbox";
      cb.value = c.id;
      cb.checked = sel.includes(c.id);
      cb.addEventListener("change", () => {
        sel = Array.from(box.querySelectorAll("input:checked")).map(i => i.value);
        save(sel);
        apply(data, sel);
      });
      label.appendChild(cb);
      label.appendChild(document.createTextNode(c.code));
      if (c.name) label.title = c.name;
      body.appendChild(label);
    });
    const note = document.createElement("div");
    note.className = "course-filter-note";
    note.textContent = "Nothing ticked = show everything.";
    body.appendChild(note);
    sidebar.appendChild(box);
    apply(data, sel);
  }

  document.addEventListener("DOMContentLoaded", () => {
    fetch(new URL("courses.json", root))
      .then(r => r.ok ? r.json() : null)
      .then(data => { if (data) render(data); })
      .catch(() => { /* filter is optional */ });
  });
})();
</script>
