<!-- Course filter: a collapsed panel at the bottom of the sidebar. With nothing ticked,
     everything is shown in topic order. With courses ticked, the sidebar lists
     only those courses' knowledge points in course order (by chapter), the
     previous/next links follow that order, and exercises that belong to none
     of the selected courses are hidden. The choice is kept per browser
     (localStorage). Data: courses.json, generated by build/make_site.py. -->
<style>
  .course-filter { margin: 1.2rem 0 0.6rem; font-size: 0.8rem; color: #7A7A7A; }
  .course-filter summary { cursor: pointer; list-style: none; }
  .course-filter summary::-webkit-details-marker { display: none; }
  .course-filter summary::after { content: " \25B8"; }
  .course-filter[open] summary::after { content: " \25BE"; }
  .course-filter .course-filter-body { padding: 0.3rem 0 0 0.2rem; }
  .course-filter label { display: block; cursor: pointer; margin: 0.1rem 0; }
  .course-filter input { margin-right: 0.35rem; }
  .course-filter-note { color: #7A7A7A; margin-top: 0.25rem; }
  .course-hidden { display: none !important; }
  .course-order-tree .depth2 > .course-order-section > .sidebar-item-container .menu-text { font-size: 0.85em; color: #7A7A7A; }
  .course-banner { border-left: 3px solid #A5533B; background: rgba(165, 83, 59, 0.07); padding: 0.4rem 0.7rem; margin: 0 0 1rem; font-size: 0.9rem; }
</style>
<script>
(function () {
  const KEY = "study-course-filter";
  const offsetMeta = document.querySelector('meta[name="quarto:offset"]');
  const root = new URL(offsetMeta ? offsetMeta.content : "./", window.location.href);

  function load() {
    try { return JSON.parse(localStorage.getItem(KEY) || "[]"); } catch (e) { return []; }
  }
  function save(sel) {
    try { localStorage.setItem(KEY, JSON.stringify(sel)); } catch (e) { /* private mode */ }
  }
  function sitePath(href) {
    const u = new URL(href, window.location.href);
    let p = u.pathname.startsWith(root.pathname) ? u.pathname.slice(root.pathname.length) : u.pathname;
    if (p === "" || p.endsWith("/")) p += "index.html";
    return p;
  }
  function overlaps(list, sel) { return (list || []).some(c => sel.includes(c)); }

  // Original Quarto sidebar tree (topic order) and the course-order tree built from it.
  let topicTree = null, courseTree = null, navOriginal = null;

  function leafMap() {
    const m = {};
    topicTree.querySelectorAll("li.sidebar-item:not(.sidebar-item-section)").forEach(li => {
      const a = li.querySelector("a.sidebar-link");
      if (a) m[sitePath(a.getAttribute("href"))] = li;
    });
    return m;
  }

  function section(title, href, depth) {
    const li = document.createElement("li");
    li.className = "sidebar-item sidebar-item-section course-order-section";
    const head = document.createElement("div");
    head.className = "sidebar-item-container";
    const t = document.createElement(href ? "a" : "span");
    t.className = "sidebar-item-text sidebar-link";
    if (href) t.href = new URL(href, root).href;
    const span = document.createElement("span");
    span.className = "menu-text";
    span.textContent = title;
    t.appendChild(span);
    head.appendChild(t);
    const ul = document.createElement("ul");
    ul.className = "list-unstyled sidebar-section depth" + depth;
    li.appendChild(head);
    li.appendChild(ul);
    return [li, ul];
  }

  // Course numbering: chapter.k, by position inside the chapter (e.g. 2.8).
  // Notes keep their own topic number on the page itself; only the sidebar and
  // previous/next links use the course number while a filter is active.
  const TOPIC_NUM = /^\s*\d+(\.\d+)*\s+/;
  function courseNumbers(data, cid) {
    const m = {};
    (data.order[cid] || []).forEach(ch => ch.pages.forEach((p, k) => {
      m[p] = ch.num ? ch.num + "." + (k + 1) : "";
    }));
    return m;
  }
  function plainTitle(li) {
    return li.querySelector(".menu-text").textContent.replace(TOPIC_NUM, "").trim();
  }
  function renumber(li, num) {
    // change only the text node, so a progress dot inside .menu-text survives
    const text = li.querySelector(".menu-text");
    const node = Array.from(text.childNodes).reverse().find(n => n.nodeType === 3 && n.textContent.trim());
    const title = text.textContent.replace(TOPIC_NUM, "").trim();
    if (node) node.textContent = (num ? num + " " : "") + title;
  }

  // Sidebar in course order: one block per selected course, grouped by chapter.
  function buildCourseTree(data, sel) {
    const leaves = leafMap();
    const tree = document.createElement("ul");
    tree.className = "list-unstyled mt-1 course-order-tree";
    data.courses.filter(c => sel.includes(c.id)).forEach(c => {
      const [cli, cul] = section(c.code + " (course order)", "courses/" + c.id + ".html", 1);
      const nums = courseNumbers(data, c.id);
      (data.order[c.id] || []).forEach(ch => {
        const [hli, hul] = section(ch.title, null, 2);
        ch.pages.forEach(p => {
          if (!leaves[p]) return;
          const li = leaves[p].cloneNode(true);
          li.classList.remove("course-hidden");
          renumber(li, nums[p]);
          hul.appendChild(li);
        });
        if (hul.children.length) cul.appendChild(hli);
      });
      tree.appendChild(cli);
    });
    return tree;
  }

  function navLink(path, title, dir) {
    const div = document.createElement("div");
    div.className = "nav-page nav-page-" + dir;
    if (!path) return div;
    const a = document.createElement("a");
    a.className = "pagination-link";
    a.href = new URL(path, root).href;
    a.setAttribute("aria-label", title);
    const icon = '<i class="bi bi-arrow-' + (dir === "previous" ? "left" : "right") + '-short"></i>';
    const text = document.createElement("span");
    text.className = "nav-page-text";
    text.textContent = title;
    a.innerHTML = dir === "previous" ? icon + " " : "";
    a.appendChild(text);
    if (dir === "next") a.insertAdjacentHTML("beforeend", " " + icon);
    div.appendChild(a);
    return div;
  }

  // Previous/next links at the bottom follow the course order of the first
  // selected course that contains this page.
  function applyNav(data, sel) {
    const nav = document.querySelector("nav.page-navigation");
    if (!nav) return;
    if (navOriginal === null) navOriginal = nav.innerHTML;
    nav.innerHTML = navOriginal;
    if (!sel.length) return;
    const here = sitePath(window.location.href);
    const leaves = leafMap();
    for (const c of data.courses) {
      if (!sel.includes(c.id)) continue;
      const nums = courseNumbers(data, c.id);
      const title = p => ((nums[p] ? nums[p] + " " : "") + (leaves[p] ? plainTitle(leaves[p]) : p));
      const flat = (data.order[c.id] || []).flatMap(ch => ch.pages).filter(p => leaves[p]);
      const i = flat.indexOf(here);
      if (i < 0) continue;
      nav.innerHTML = "";
      nav.appendChild(navLink(flat[i - 1], flat[i - 1] && title(flat[i - 1]), "previous"));
      nav.appendChild(navLink(flat[i + 1], flat[i + 1] && title(flat[i + 1]), "next"));
      return;
    }
  }

  function apply(data, sel) {
    const active = sel.length > 0;
    // sidebar: topic order when no filter, course order when filtered
    if (courseTree) { courseTree.remove(); courseTree = null; }
    if (topicTree) {
      topicTree.classList.toggle("course-hidden", active);
      if (active) {
        courseTree = buildCourseTree(data, sel);
        topicTree.after(courseTree);
      }
    }
    applyNav(data, sel);
    // exercises on the page
    document.querySelectorAll("[data-courses]").forEach(el => {
      const courses = el.getAttribute("data-courses").split(/\s+/).filter(Boolean);
      el.classList.toggle("course-hidden", active && !overlaps(courses, sel));
    });
    // banner when the current page is outside the selection
    const here = data.pages[sitePath(window.location.href)];
    let banner = document.querySelector(".course-banner");
    const outside = active && here !== undefined && !overlaps(here, sel);
    if (outside && !banner) {
      banner = document.createElement("div");
      banner.className = "course-banner";
      banner.textContent = "This page is not part of the selected course(s).";
      const main = document.querySelector("main") || document.body;
      main.insertBefore(banner, main.firstChild);
    } else if (!outside && banner) {
      banner.remove();
    }
  }

  function render(data) {
    const sidebar = document.querySelector("#quarto-sidebar .sidebar-menu-container") || document.querySelector("#quarto-sidebar");
    if (!sidebar || !data.courses.length) return;
    topicTree = sidebar.querySelector(":scope > ul");
    data.order = data.order || {};
    let sel = load().filter(id => data.courses.some(c => c.id === id));
    const box = document.createElement("details");
    box.className = "course-filter";
    box.open = sel.length > 0;  // stays open while a filter is active
    box.innerHTML = '<summary>Filter by course</summary>';
    const body = document.createElement("div");
    body.className = "course-filter-body";
    box.appendChild(body);
    data.courses.forEach(c => {
      const label = document.createElement("label");
      const cb = document.createElement("input");
      cb.type = "checkbox";
      cb.value = c.id;
      cb.checked = sel.includes(c.id);
      cb.addEventListener("change", () => {
        sel = Array.from(box.querySelectorAll("input:checked")).map(i => i.value);
        save(sel);
        apply(data, sel);
      });
      label.appendChild(cb);
      label.appendChild(document.createTextNode(c.code));
      if (c.name) label.title = c.name;
      body.appendChild(label);
    });
    const note = document.createElement("div");
    note.className = "course-filter-note";
    note.textContent = "Nothing ticked = show everything.";
    body.appendChild(note);
    sidebar.appendChild(box);
    apply(data, sel);
  }

  document.addEventListener("DOMContentLoaded", () => {
    fetch(new URL("courses.json", root))
      .then(r => r.ok ? r.json() : null)
      .then(data => { if (data) render(data); })
      .catch(() => { /* filter is optional */ });
  });
})();
</script>
